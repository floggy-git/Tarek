<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    *{box-sizing:border-box} :root{--nav:#0f2a4a;--blue:#1a73e8;--green:#0f9d58;--ink:#1f2937;--muted:#64748b;--line:#e2e8f0;--bg:#f5f7fb;--danger:#b42318}
    body{margin:0;background:var(--bg);font-family:Inter,Arial,sans-serif;color:var(--ink)} button,input,select,textarea{font:inherit}
    .app{display:flex;min-height:100vh}.side{width:245px;background:var(--nav);color:#fff;padding:18px 14px;position:fixed;inset:0 auto 0 0;overflow:auto}
    .brand{padding:10px 8px 22px;border-bottom:1px solid #ffffff1f;font-weight:900;font-size:15px}.brand small{font-weight:500;opacity:.72;font-size:11px}.nav{padding-top:14px}.nav button{width:100%;border:0;background:transparent;color:#dbeafe;text-align:left;padding:10px 12px;border-radius:9px;margin:2px 0;cursor:pointer}.nav button:hover,.nav button.active{background:var(--blue);color:#fff;font-weight:800}
    .main{margin-left:245px;flex:1;padding:20px;min-width:0}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.top h1{margin:0;font-size:24px}.sub{font-size:12px;color:var(--muted);margin-top:4px}.actions,.toolbar{display:flex;gap:8px;flex-wrap:wrap}.btn{border:0;border-radius:9px;padding:9px 13px;cursor:pointer;font-weight:800;font-size:12px}.primary{background:var(--blue);color:#fff}.secondary{background:#fff;border:1px solid var(--line);color:var(--ink)}.danger{background:#fff1f0;color:var(--danger);border:1px solid #ffd5d2}.green{background:var(--green);color:#fff}
    .grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:15px;min-width:0;box-shadow:0 1px 2px #0f172a0a}.metric .label{font-size:11px;color:var(--muted);font-weight:800;text-transform:uppercase}.metric .value{font-size:24px;font-weight:900;margin-top:7px}.metric .hint{font-size:10px;color:var(--green);margin-top:4px}.wide{grid-column:span 4}.half{grid-column:span 3}.full{grid-column:1/-1}.section-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.section-title b{font-size:14px}.section-title span{font-size:10px;color:var(--muted)}
    .scroll{overflow:auto} table{width:100%;border-collapse:collapse;font-size:12px} th,td{text-align:left;padding:9px 7px;border-bottom:1px solid var(--line);white-space:nowrap;max-width:280px;overflow:hidden;text-overflow:ellipsis} th{font-size:10px;text-transform:uppercase;color:var(--muted);background:#f8fafc;position:sticky;top:0} tr.clickable{cursor:pointer}tr.clickable:hover{background:#f8fbff}.pill{display:inline-block;padding:4px 7px;border-radius:999px;background:#e8f4ff;color:#1557b0;font-size:10px;font-weight:800}.ok{background:#e8f6ee;color:#137333}.bad{background:#fff0ee;color:#b42318}
    .toolbar{margin-bottom:10px}.toolbar input{border:1px solid var(--line);border-radius:8px;padding:9px 10px;min-width:200px}.empty{padding:28px;text-align:center;color:var(--muted)}.loading{position:fixed;inset:0;background:#ffffffe8;display:grid;place-items:center;z-index:40;font-weight:900}.toast{position:fixed;right:20px;bottom:20px;background:#152b45;color:#fff;padding:12px 16px;border-radius:9px;display:none;z-index:50;max-width:420px}
    .form-card{max-width:1000px;margin:auto}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.field label{display:block;font-size:11px;font-weight:800;margin-bottom:5px;color:#475569}.field input,.field select,.field textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}.field textarea{min-height:88px;resize:vertical}.field input[readonly],.field input:disabled{background:#f1f5f9;color:#64748b}.span2{grid-column:1/-1}.note{padding:10px 12px;background:#eff6ff;border:1px solid #bfdbfe;border-radius:10px;font-size:11px;color:#1e40af;margin-bottom:12px}.status-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.status-item{border:1px solid var(--line);border-radius:10px;padding:11px;background:#fff}.status-item b{display:block;font-size:12px;margin-bottom:4px}.status-item small{color:var(--muted)}
    @media(max-width:1050px){.grid{grid-template-columns:repeat(2,1fr)}.wide,.half{grid-column:1/-1}.status-grid{grid-template-columns:1fr 1fr}}@media(max-width:720px){.side{position:static;width:100%}.app{display:block}.main{margin-left:0}.nav{display:grid;grid-template-columns:repeat(2,1fr)}.grid,.form-grid,.status-grid{grid-template-columns:1fr}.wide,.half,.span2{grid-column:auto}.top{flex-direction:column;align-items:flex-start}}
  </style>
</head>
<body>
<div id="loading" class="loading">Loading Master Control Center…</div>
<div class="app">
  <aside class="side">
    <div class="brand">🚗 TAREK RIJSCHOOL<br><small>MASTER CONTROL CENTER</small></div>
    <div class="nav" id="nav"></div>
  </aside>
  <main class="main">
    <div class="top">
      <div><h1 id="title">Dashboard</h1><div class="sub" id="sync">Connecting to Google Sheets…</div></div>
      <div class="actions"><button class="btn secondary" onclick="loadData()">↻ Sync</button><button class="btn primary" onclick="newRecord('students')">+ Student</button><button class="btn green" onclick="newRecord('payments')">+ Deposit</button></div>
    </div>
    <div id="content"></div>
  </main>
</div>
<div id="toast" class="toast"></div>
<script>
const S={data:null,section:'dashboard',query:'',editing:null};
const sections=[
  ['dashboard','⌂ Dashboard'],['students','👤 Students'],['lessons','📅 Lessons'],['trainers','👔 Trainers'],['trainerSchedule','🗓 Trainer Schedule'],['payments','💶 Wallet / Deposits'],['invoices','📄 Invoices'],['packages','📦 Packages'],['notifications','🔔 Notifications'],['availability','⏱ Availability'],['expenseCategories','🗂 Expense Categories'],['expenses','💸 Expenses'],['documents','📁 Documents'],['help','❓ Help & Support'],['media','🎬 Media Library'],['settings','⚙ School Settings'],['controlSettings','🛠 Control Settings'],['audit','🛡 Audit Log'],['status','✓ System Status']
];
const idHeaders=['Student ID','Lesson ID','Trainer ID','Transaction ID','Invoice ID','Notification ID','Category ID','Expense ID','Availability ID','Document ID','id','ID'];
const readOnlyFields={students:['Student ID','Balance (€)'],lessons:['Lesson ID','Student Name','Calendar Event ID'],trainers:['Trainer ID'],trainerSchedule:['Trainer Name'],payments:['Transaction ID','Student Name','Date','Drive Invoice URL'],invoices:['Invoice ID','Student Name','Student Email'],notifications:['Notification ID'],expenseCategories:['Category ID'],expenses:['Expense ID','Category Name'],availability:['Availability ID','Trainer Name'],documents:['Document ID','Owner Name','Created At'],help:['ID'],media:['id']};
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function money(v){return '€'+Number(v||0).toLocaleString(undefined,{minimumFractionDigits:0,maximumFractionDigits:2})}
function toast(m){const x=document.getElementById('toast');x.textContent=m;x.style.display='block';setTimeout(()=>x.style.display='none',3200)}
function fail(e){document.getElementById('loading').style.display='none';toast(e?.message||String(e))}
function loadData(){document.getElementById('loading').style.display='grid';google.script.run.withSuccessHandler(r=>{S.data=r;document.getElementById('loading').style.display='none';document.getElementById('sync').textContent='Live Google Sheets · '+new Date(r.generatedAt).toLocaleString();render()}).withFailureHandler(fail).controlCenterGetData()}
function go(s){S.section=s;S.query='';S.editing=null;render()}
function renderNav(){document.getElementById('nav').innerHTML=sections.map(s=>`<button class="${S.section===s[0]?'active':''}" onclick="go('${s[0]}')">${s[1]}</button>`).join('')}
function render(){renderNav();const sec=sections.find(x=>x[0]===S.section);document.getElementById('title').textContent=sec?sec[1].replace(/^\S+\s/,''):S.section;if(S.section==='dashboard')return dashboard();if(S.section==='status')return statusView();if(S.section==='settings')return settingsForm();table(sectionRows())}
function sectionRows(){return (S.data[S.section]||[])}
function metric(a,b,c){return `<div class="card metric"><div class="label">${a}</div><div class="value">${b}</div><div class="hint">${c}</div></div>`}
function mini(rows,cols){if(!rows.length)return '<div class="empty">No records</div>';return `<div class="scroll"><table><thead><tr>${cols.map(c=>`<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${cols.map(c=>`<td>${/amount|balance|price/i.test(c)?money(r[c]):esc(r[c]??'')}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}
function dashboard(){const d=S.data,k=d.dashboard;document.getElementById('content').innerHTML=`<div class="grid">${metric('Total Students',k.totalStudents,k.activeStudents+' active')}${metric("Today's Lessons",k.todayLessons,'scheduled today')}${metric('Monthly Deposits',money(k.monthlyRevenue),'current month')}${metric('Outstanding',money(k.outstandingBalance),'negative balances')}${metric('Upcoming Lessons',k.upcomingLessons,'from today')}${metric('Invoices',k.totalInvoices,'records')}<div class="card wide"><div class="section-title"><b>Recent Lessons</b><span>${d.lessons.length} total</span></div>${mini(d.lessons.slice(-10).reverse(),['date','time','studentId','name','status'])}</div><div class="card half"><div class="section-title"><b>Outstanding Balances</b></div>${mini(d.students.filter(x=>Number(x.balance)<0).slice(0,8),['studentId','name','balance','status'])}</div><div class="card half"><div class="section-title"><b>Recent Wallet Activity</b></div>${mini(d.payments.slice(-8).reverse(),['date','studentId','amount','type','desc'])}</div></div>`}
function statusView(){const st=S.data.status||{checks:[]};document.getElementById('content').innerHTML=`<div class="card"><div class="section-title"><b>Live schema verification</b><span class="pill ${st.ok?'ok':'bad'}">${st.ok?'ALL OK':'ATTENTION REQUIRED'}</span></div><div class="status-grid">${(st.checks||[]).map(x=>`<div class="status-item"><b>${esc(x.sheet)} <span class="pill ${x.ok?'ok':'bad'}">${x.ok?'OK':'Mismatch'}</span></b><small>${esc(x.message)}</small></div>`).join('')}</div></div>`}
function canAdd(){return !['audit','status','settings'].includes(S.section)}
function table(rows){document.getElementById('content').innerHTML=`<div class="card full"><div class="toolbar"><input id="q" placeholder="Search…" oninput="filter()">${canAdd()?`<button class="btn primary" onclick="newRecord('${S.section}')">+ Add</button>`:''}</div><div id="tbl">${tableHtml(rows)}</div></div>`}
function keys(){if(S.section==='audit')return ['Audit ID','User Name','Action','Changed By','Date','Time','Target Record','Source'];return (S.data.schemas?.[S.section]||[]).slice(0,14)}
function tableHtml(rows){if(!rows.length)return '<div class="empty">No records found.</div>';const ks=keys();return `<div class="scroll"><table><thead><tr>${ks.map(k=>`<th>${esc(k)}</th>`).join('')}</tr></thead><tbody>${rows.map((r,i)=>`<tr ${S.section==='audit'?'':`class="clickable" onclick="editRecord(${i})"`}>${ks.map(k=>{const v=r[k];if(/amount|price|balance|rate/i.test(k))return `<td>${money(v)}</td>`;if(/status|active|enabled/i.test(k))return `<td><span class="pill">${esc(v??'')}</span></td>`;return `<td>${esc(v??'')}</td>`}).join('')}</tr>`).join('')}</tbody></table></div>`}
function filtered(){return sectionRows().filter(r=>JSON.stringify(r).toLowerCase().includes(S.query))}
function filter(){S.query=document.getElementById('q').value.toLowerCase();document.getElementById('tbl').innerHTML=tableHtml(filtered())}
function newRecord(s){S.section=s;S.editing=null;if(s==='settings')return settingsForm();let seed={};if(s==='lessons')seed={'Duration (h)':1,'Price (€)':Number(S.data.settings?.lessonPricePerHour||65),'Trainer Name':S.data.settings?.instructorName||'','Status':'upcoming'};if(s==='students')seed={'Status':'active','Exam Readiness (%)':0};if(s==='payments')seed={'Type':'deposit'};if(s==='invoices')seed={'Status':'unpaid'};if(s==='packages')seed={isActive:'TRUE',popular:'FALSE',recommended:'FALSE'};recordForm(seed)}
function editRecord(i){const rows=S.query?filtered():sectionRows();S.editing=rows[i]||null;if(!S.editing&&S.section==='instructors')S.editing={};recordForm(S.editing||{})}
function schema(){return ((S.data.schemas&&S.data.schemas[S.section])||[])}
function enc(s){return encodeURIComponent(s).replace(/%/g,'_')}
function fieldType(h){if(/date of birth|^date$/i.test(h))return 'date';if(/^time$|start time|end time/i.test(h))return 'time';if(/amount|price|balance|hours|duration|rating|order|readiness|rate/i.test(h))return 'number';if(/description|notes|message|features|instructions|policy|footer|answer_/i.test(h))return 'textarea';if(/email/i.test(h))return 'email';return 'text'}
function norm(v,t){if(v==null)return '';if(t==='date')return String(v).slice(0,10);if(t==='time')return String(v).match(/\d{2}:\d{2}/)?.[0]||String(v);return v}
function choices(h){
  if(h==='Student ID'||h==='Target Student ID')return (S.data.students||[]).map(x=>[x['Student ID'],`${x.Name} (${x['Student ID']})`]);
  if(h==='Trainer ID')return (S.data.trainers||[]).map(x=>[x['Trainer ID'],`${x.Name} (${x['Trainer ID']})`]);
  if(h==='Trainer Name'&&S.section==='lessons')return (S.data.trainers||[]).map(x=>[x.Name,x.Name]);
  if(h==='Current Package')return (S.data.packages||[]).filter(x=>String(x.isActive??'TRUE').toLowerCase()!=='false').map(x=>[x.name,x.name]);
  if(h==='Category ID')return (S.data.expenseCategories||[]).filter(x=>String(x.Active??'TRUE').toLowerCase()!=='false').map(x=>[x['Category ID'],x.Name]);
  if(h==='Owner Type')return [['student','student'],['trainer','trainer'],['school','school']];
  if(h==='Owner ID')return [...(S.data.students||[]).map(x=>[x['Student ID'],`${x.Name} — Student`]),...(S.data.trainers||[]).map(x=>[x['Trainer ID'],`${x.Name} — Trainer`])];
  if(h==='Day of Week')return ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'].map(x=>[x,x]);
  if(h==='Status'&&S.section==='students')return [['active','active'],['inactive','inactive'],['suspended','suspended']];
  if(h==='Status'&&S.section==='trainers')return [['active','active'],['inactive','inactive'],['on_leave','on_leave']];
  if(h==='Status'&&S.section==='lessons')return [['upcoming','upcoming'],['active','active'],['completed','completed'],['cancelled','cancelled']];
  if(h==='Status'&&S.section==='invoices')return [['unpaid','unpaid'],['paid','paid'],['credited','credited']];
  if(h==='Status'&&S.section==='availability')return [['available','available'],['blocked','blocked'],['booked','booked']];
  if(h==='Status'&&S.section==='expenses')return [['planned','planned'],['paid','paid'],['cancelled','cancelled']];
  if(h==='Status'&&S.section==='documents')return [['active','active'],['archived','archived']];
  if(h==='Type'&&S.section==='payments')return [['deposit','deposit'],['adjustment','adjustment']];
  if(h==='Recipient Role')return [['student','student'],['trainer','trainer'],['admin','admin'],['all','all']];
  if(h==='type'&&S.section==='media')return [['video','video'],['image','image']];
  if(h==='language')return [['all','all'],['nl','nl'],['en','en'],['ar','ar']];
  if(['popular','recommended','isActive','Active','isEnabled','isDeletedByTrainer','Read Status','aiCoachEnabled','notificationsEnabled','Is Available','Editable'].includes(h))return [['TRUE','TRUE'],['FALSE','FALSE']];
  return null;
}
function isReadonly(h){if(idHeaders.includes(h))return true;if(S.editing&&S.section==='controlSettings'&&h==='Key')return true;if(S.editing&&S.section==='trainerSchedule'&&['Trainer ID','Day of Week'].includes(h))return true;if(S.editing&&S.section==='lessons'&&['Student ID','Duration (h)','Price (€)'].includes(h))return true;if(S.editing&&S.section==='packages'&&h==='name')return true;return (readOnlyFields[S.section]||[]).includes(h)}
function formNotice(){if(S.section==='students')return 'Student ID is generated automatically. Balance is ledger-controlled through Wallet / Deposits. Firebase login/password is not stored in Google Sheets.';if(S.section==='lessons')return 'A new lesson checks the student wallet and creates the matching Wallet payment automatically. Google Calendar remains disabled.';if(S.section==='trainers')return 'Trainer ID is generated automatically. Existing lessons keep the trainer name stored on the lesson.';if(S.section==='documents')return 'This stores document metadata only. It never fabricates or deletes the actual Google Drive file.';if(S.section==='media')return 'Media records must point to real URLs or Drive file IDs. No fake media is created.';return ''}
function recordForm(r){const sc=schema();if(!sc.length)return toast('No schema found for this section.');const notice=formNotice();document.getElementById('content').innerHTML=`<div class="card form-card"><div class="section-title"><b>${S.editing?'Edit':'Add'} ${esc(S.section)}</b><span>Live Google Sheets</span></div>${notice?`<div class="note">${esc(notice)}</div>`:''}<div class="form-grid">${sc.map(h=>fieldHtml(h,r[h]??'')).join('')}</div><div class="actions" style="margin-top:16px"><button class="btn secondary" onclick="go('${S.section}')">Cancel</button>${S.editing&&!['settings'].includes(S.section)?`<button class="btn danger" onclick="del()">Delete</button>`:''}<button class="btn primary" onclick="save()">Save</button></div></div>`}
function fieldHtml(h,v){const t=fieldType(h),op=choices(h),ro=isReadonly(h),span=t==='textarea'?' span2':'';if(op)return `<div class="field${span}"><label>${esc(h)}</label><select id="f_${enc(h)}" ${ro?'disabled':''}><option value="">Select…</option>${op.map(x=>`<option value="${esc(x[0])}" ${String(v)===String(x[0])?'selected':''}>${esc(x[1])}</option>`).join('')}</select></div>`;if(t==='textarea')return `<div class="field span2"><label>${esc(h)}</label><textarea id="f_${enc(h)}" ${ro?'readonly':''}>${esc(v)}</textarea></div>`;return `<div class="field"><label>${esc(h)}</label><input id="f_${enc(h)}" type="${t}" ${ro?'readonly':''} value="${esc(norm(v,t))}" ${(!S.editing&&idHeaders.includes(h))?'placeholder="Generated automatically"':''}></div>`}
function collect(){const o={};schema().forEach(h=>{const el=document.getElementById('f_'+enc(h));if(!el){if(S.editing)o[h]=S.editing[h]??'';return}let v=el.value;if(el.type==='number'&&v!=='')v=Number(v);o[h]=v});if(S.editing?.id)o.id=S.editing.id;return o}
function save(){document.getElementById('loading').style.display='grid';google.script.run.withSuccessHandler(()=>{toast('Saved successfully');S.editing=null;loadData()}).withFailureHandler(fail).controlCenterSaveRecord(S.section,collect())}
function del(){if(!S.editing?.id)return toast('Record ID missing.');if(!confirm('Delete this record permanently? Related data integrity rules will be enforced.'))return;document.getElementById('loading').style.display='grid';google.script.run.withSuccessHandler(()=>{toast('Deleted');S.editing=null;loadData()}).withFailureHandler(fail).controlCenterDeleteRecord(S.section,S.editing.id)}
function settingsForm(){S.section='settings';const r=S.data.settings||{};S.editing=r;recordForm(r)}
loadData();
</script>
</body>
</html>
