<!doctype html><html><head><base target="_top"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
*{box-sizing:border-box} :root{--nav:#071a2e;--blue:#1675e8;--green:#18a36a;--amber:#e49a1b;--red:#d84c59;--ink:#17263a;--muted:#718096;--line:#e5ebf2;--bg:#f4f7fb}html,body{min-height:100%}body{margin:0;background:var(--bg);font:11px Inter,"Segoe UI",Arial,sans-serif;color:var(--ink)}button,input,select,textarea{font:inherit}.app{display:flex;min-height:100vh}.side{width:184px;background:linear-gradient(180deg,#071a2e,#09243d);color:#fff;position:fixed;inset:0 auto 0 0;padding:9px 8px;overflow:auto}.brand{display:flex;gap:7px;align-items:center;padding:5px 5px 10px;border-bottom:1px solid #ffffff18}.logo{width:30px;height:30px;border-radius:8px;background:var(--blue);display:grid;place-items:center;font-size:14px}.brand b{font-size:11px}.brand small{display:block;color:#8fa8c1;font-size:7px;letter-spacing:.8px;margin-top:2px}.nav{padding-top:7px}.group{margin-top:7px}.group:first-child{margin-top:0}.gl{font-size:7px;color:#66839e;font-weight:900;letter-spacing:1px;padding:4px 7px;text-transform:uppercase}.nav button{width:100%;border:0;background:transparent;color:#c7d6e5;text-align:left;padding:5px 7px;border-radius:6px;margin:1px 0;cursor:pointer;display:flex;align-items:center;gap:6px;font-size:9.5px}.nav button:hover{background:#ffffff0d;color:#fff}.nav button.active{background:linear-gradient(90deg,#1479ee,#1168ce);color:#fff;font-weight:800}.ni{width:19px;height:19px;border-radius:5px;background:#ffffff0d;display:grid;place-items:center;font-size:10px}.main{margin-left:184px;flex:1;min-width:0;padding:0 12px 16px}.top{position:sticky;top:0;z-index:10;margin:0 -12px 10px;padding:8px 12px;background:#f4f7fbf2;backdrop-filter:blur(9px);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:8px}.head{display:flex;align-items:center;gap:7px}.pm{width:28px;height:28px;border-radius:7px;background:#e8f2ff;color:#176fd3;display:grid;place-items:center;font-size:12px}.top h1{font-size:16px;margin:0}.sub{font-size:8px;color:var(--muted);margin-top:1px}.dot{display:inline-block;width:5px;height:5px;border-radius:50%;background:#20b26f;margin-right:4px}.actions,.toolbar{display:flex;gap:5px;align-items:center;flex-wrap:wrap}.btn{border:0;border-radius:6px;padding:5px 8px;min-height:27px;font-size:9px;font-weight:800;cursor:pointer}.primary{background:var(--blue);color:#fff}.green{background:var(--green);color:#fff}.secondary{background:#fff;border:1px solid var(--line);color:var(--ink)}.danger{background:#fff0ef;border:1px solid #ffd5d2;color:#b42318}.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:7px}.card{background:#fff;border:1px solid var(--line);border-radius:9px;padding:9px;min-width:0;box-shadow:0 2px 8px #10243a0a}.metric{grid-column:span 2;min-height:72px;position:relative}.metric .l{font-size:7.5px;color:var(--muted);font-weight:900;text-transform:uppercase;letter-spacing:.4px}.metric .v{font-size:18px;font-weight:900;margin-top:5px}.metric .h{font-size:7.5px;color:var(--muted);margin-top:2px}.mi{position:absolute;right:8px;top:8px;width:24px;height:24px;border-radius:7px;display:grid;place-items:center;font-size:11px;background:#edf5ff}.blue .mi{background:#eaf3ff}.greenM .mi{background:#e9f8f1}.amber .mi{background:#fff4df}.violet .mi{background:#f1edff}.red .mi{background:#fff0f2}.cyan .mi{background:#e9f8fb}.s7{grid-column:span 7}.s5{grid-column:span 5}.s6{grid-column:span 6}.full{grid-column:1/-1}.st{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:6px}.st b{font-size:10.5px}.st span,.ps{font-size:7.5px;color:var(--muted)}.ps{margin-top:2px}.quick{display:grid;grid-template-columns:repeat(2,1fr);gap:5px}.qa{border:1px solid var(--line);background:#fbfcfe;border-radius:7px;padding:7px;display:flex;gap:6px;align-items:center;cursor:pointer;text-align:left}.qa:hover{background:#f4f9ff}.qi{width:24px;height:24px;border-radius:6px;background:#edf5ff;display:grid;place-items:center;font-size:11px}.qa b{font-size:8.5px}.qa small{display:block;font-size:7px;color:var(--muted);margin-top:1px}.scroll{overflow:auto;max-height:300px;border:1px solid #edf1f6;border-radius:7px}table{width:100%;border-collapse:collapse;background:#fff;font-size:8.8px}th,td{text-align:left;padding:5px 6px;border-bottom:1px solid #edf1f6;white-space:nowrap;max-width:180px;overflow:hidden;text-overflow:ellipsis}th{position:sticky;top:0;background:#f8fafc;color:#718096;font-size:7px;text-transform:uppercase;letter-spacing:.35px}tr.clickable{cursor:pointer}tr.clickable:hover{background:#f8fbff}.pill{display:inline-block;padding:2px 5px;border-radius:999px;background:#edf5ff;color:#165eb2;font-size:7px;font-weight:800}.ok{background:#e8f7ef;color:#137346}.bad{background:#fff0ee;color:#b42318}.toolbar{border-bottom:1px solid #edf1f6;padding-bottom:7px;margin-bottom:7px}.search{min-width:190px;flex:1;max-width:360px}.toolbar input{width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:#fbfcfe;outline:0;font-size:8.5px}.empty{padding:16px;text-align:center;color:var(--muted);font-size:8px}.loading{position:fixed;inset:0;background:#f7f9fcee;display:grid;place-items:center;z-index:50;color:#23415e;font-weight:900}.spin{width:27px;height:27px;border:3px solid #dce8f5;border-top-color:var(--blue);border-radius:50%;animation:s .8s linear infinite;margin:0 auto 7px}@keyframes s{to{transform:rotate(360deg)}}.toast{position:fixed;right:12px;bottom:12px;background:#102b45;color:#fff;padding:8px 10px;border-radius:7px;display:none;z-index:60;font-size:8.5px}.form-card{max-width:820px;margin:auto;padding:0;overflow:hidden}.fh{padding:9px 10px 7px;border-bottom:1px solid var(--line)}.fb{padding:10px}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}.field label{display:block;font-size:8px;font-weight:900;color:#52657a;margin-bottom:3px}.field input,.field select,.field textarea{width:100%;padding:6px 7px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink);outline:0;font-size:9px}.field textarea{min-height:58px;resize:vertical}.field input[readonly],.field input:disabled,.field select:disabled{background:#f3f6f9;color:#7c8b9c}.span2{grid-column:1/-1}.note{padding:6px 7px;border:1px solid #bfdbfe;background:#eff6ff;color:#1e40af;border-radius:6px;font-size:8px;margin-bottom:7px}.fa{display:flex;justify-content:flex-end;gap:5px;padding:8px 10px;border-top:1px solid var(--line);background:#fbfcfe}.status-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}.si{border:1px solid var(--line);border-radius:7px;padding:7px}.si b{font-size:8.5px}.si small{display:block;color:var(--muted);font-size:7px;margin-top:2px}@media(max-width:1150px){.metric{grid-column:span 4}.s7,.s5{grid-column:span 12}}@media(max-width:850px){.side{width:164px}.main{margin-left:164px}.metric{grid-column:span 6}}@media(max-width:650px){.side{position:static;width:100%;max-height:none}.main{margin-left:0}.nav{display:grid;grid-template-columns:repeat(2,1fr);gap:2px}.gl{display:none}.group{display:contents}.top{position:static}.metric,.s7,.s5,.s6{grid-column:1/-1}.form-grid,.status-grid{grid-template-columns:1fr}.span2{grid-column:auto}}
</style></head><body><div id="loading" class="loading"><div><div class="spin"></div>Loading Control Center…</div></div><div class="app"><aside class="side"><div class="brand"><div class="logo">🚗</div><div><b>TAREK RIJSCHOOL</b><small>MASTER CONTROL CENTER</small></div></div><div id="nav" class="nav"></div></aside><main class="main"><div class="top"><div class="head"><div id="pageIcon" class="pm">⌂</div><div><h1 id="title">Dashboard</h1><div id="sync" class="sub"><span class="dot"></span>Connecting…</div></div></div><div class="actions"><button class="btn secondary" onclick="loadData()">↻ Sync</button><button class="btn primary" onclick="newRecord('students')">+ Student</button><button class="btn green" onclick="newRecord('payments')">+ Deposit</button></div></div><div id="content"></div></main></div><div id="toast" class="toast"></div><script>
const S={data:null,section:'dashboard',query:'',editing:null};
const groups=[['Overview',[['dashboard','⌂','Dashboard'],['status','✓','System Status']]],['People',[['students','👤','Students'],['trainers','👔','Trainers'],['trainerSchedule','🗓','Trainer Schedule'],['availability','⏱','Availability']]],['Operations',[['lessons','📅','Lessons'],['payments','💶','Wallet / Deposits'],['invoices','📄','Invoices'],['packages','📦','Packages']]],['Management',[['notifications','🔔','Notifications'],['expenseCategories','🗂','Expense Categories'],['expenses','💸','Expenses'],['documents','📁','Documents'],['media','🎬','Media Library'],['help','❓','Help & Support']]],['System',[['settings','⚙','School Settings'],['controlSettings','🛠','Control Settings'],['audit','🛡','Audit Log']]]];
const sections=groups.flatMap(g=>g[1]);const idHeaders=['Student ID','Lesson ID','Trainer ID','Transaction ID','Invoice ID','Notification ID','Category ID','Expense ID','Availability ID','Document ID','id','ID'];const ro={students:['Student ID','Balance (€)'],lessons:['Lesson ID','Student Name','Calendar Event ID'],trainers:['Trainer ID'],trainerSchedule:['Trainer Name'],payments:['Transaction ID','Student Name','Date','Drive Invoice URL'],invoices:['Invoice ID','Student Name','Student Email'],notifications:['Notification ID'],expenseCategories:['Category ID'],expenses:['Expense ID','Category Name'],availability:['Availability ID','Trainer Name'],documents:['Document ID','Owner Name','Created At'],help:['ID'],media:['id']};
const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));const money=v=>'€'+Number(v||0).toLocaleString(undefined,{maximumFractionDigits:2});
function toast(m){const x=document.getElementById('toast');x.textContent=m;x.style.display='block';setTimeout(()=>x.style.display='none',2600)}function fail(e){loading.style.display='none';toast(e?.message||String(e))}
function loadData(){loading.style.display='grid';google.script.run.withSuccessHandler(r=>{S.data=r;loading.style.display='none';sync.innerHTML='<span class="dot"></span>Live Google Sheets · '+new Date(r.generatedAt).toLocaleString();render()}).withFailureHandler(fail).controlCenterGetData()}
function go(s){S.section=s;S.query='';S.editing=null;render()}function renderNav(){nav.innerHTML=groups.map(g=>`<div class="group"><div class="gl">${g[0]}</div>${g[1].map(x=>`<button class="${S.section===x[0]?'active':''}" onclick="go('${x[0]}')"><span class="ni">${x[1]}</span>${x[2]}</button>`).join('')}</div>`).join('')}
function render(){renderNav();const s=sections.find(x=>x[0]===S.section)||['','',''];title.textContent=s[2]||S.section;pageIcon.textContent=s[1]||'•';if(S.section==='dashboard')return dashboard();if(S.section==='status')return statusView();if(S.section==='settings')return settingsForm();table(rows())}function rows(){return S.data?.[S.section]||[]}
function metric(cls,ico,l,v,h){return `<div class="card metric ${cls}"><div class="mi">${ico}</div><div class="l">${l}</div><div class="v">${v}</div><div class="h">${h}</div></div>`}function mini(rs,cs){if(!rs.length)return'<div class="empty">No records</div>';return`<div class="scroll"><table><thead><tr>${cs.map(c=>`<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>${rs.map(r=>`<tr>${cs.map(c=>`<td>${/amount|balance|price/i.test(c)?money(r[c]):esc(r[c]??'')}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}
function dashboard(){const d=S.data,k=d.dashboard;content.innerHTML=`<div class="grid">${metric('blue','👤','Students',k.totalStudents,k.activeStudents+' active')}${metric('greenM','📅','Today',k.todayLessons,'lessons')}${metric('amber','💶','Deposits',money(k.monthlyRevenue),'this month')}${metric('red','⚠','Outstanding',money(k.outstandingBalance),'negative')}${metric('violet','⏱','Upcoming',k.upcomingLessons,'lessons')}${metric('cyan','📄','Invoices',k.totalInvoices,'records')}<div class="card s7"><div class="st"><div><b>Recent Lessons</b><div class="ps">Latest lesson activity</div></div><span>${d.lessons.length} total</span></div>${mini(d.lessons.slice(-9).reverse(),['date','time','studentId','name','status'])}</div><div class="card s5"><div class="st"><div><b>Quick Actions</b><div class="ps">Common tasks</div></div></div><div class="quick"><button class="qa" onclick="newRecord('students')"><span class="qi">👤</span><span><b>Add student</b><small>Create profile</small></span></button><button class="qa" onclick="newRecord('lessons')"><span class="qi">📅</span><span><b>New lesson</b><small>Schedule lesson</small></span></button><button class="qa" onclick="newRecord('payments')"><span class="qi">💶</span><span><b>Add deposit</b><small>Wallet credit</small></span></button><button class="qa" onclick="newRecord('invoices')"><span class="qi">📄</span><span><b>New invoice</b><small>Create record</small></span></button></div></div><div class="card s6"><div class="st"><b>Outstanding Balances</b></div>${mini(d.students.filter(x=>Number(x.balance)<0).slice(0,7),['studentId','name','balance','status'])}</div><div class="card s6"><div class="st"><b>Recent Wallet Activity</b></div>${mini(d.payments.slice(-7).reverse(),['date','studentId','amount','type','desc'])}</div></div>`}
function statusView(){const st=S.data.status||{checks:[]};content.innerHTML=`<div class="card"><div class="st"><div><b>Live schema verification</b><div class="ps">Google Sheets structure</div></div><span class="pill ${st.ok?'ok':'bad'}">${st.ok?'ALL OK':'ATTENTION'}</span></div><div class="status-grid">${(st.checks||[]).map(x=>`<div class="si"><b>${esc(x.sheet)} <span class="pill ${x.ok?'ok':'bad'}">${x.ok?'OK':'Mismatch'}</span></b><small>${esc(x.message)}</small></div>`).join('')}</div></div>`}
function canAdd(){return !['audit','status','settings'].includes(S.section)}function table(rs){content.innerHTML=`<div class="card full"><div class="st"><div><b>${esc(title.textContent)}</b><div class="ps">${rs.length} record${rs.length===1?'':'s'}</div></div></div><div class="toolbar"><div class="search"><input id="q" placeholder="Search…" oninput="filter()"></div>${canAdd()?`<button class="btn primary" onclick="newRecord('${S.section}')">+ Add</button>`:''}</div><div id="tbl">${tableHtml(rs)}</div></div>`}function keys(){if(S.section==='audit')return['Audit ID','User Name','Action','Changed By','Date','Time','Target Record','Source'];return(S.data.schemas?.[S.section]||[]).slice(0,14)}function tableHtml(rs){if(!rs.length)return'<div class="empty">No records found</div>';const ks=keys();return`<div class="scroll"><table><thead><tr>${ks.map(k=>`<th>${esc(k)}</th>`).join('')}</tr></thead><tbody>${rs.map((r,i)=>`<tr ${S.section==='audit'?'':`class="clickable" onclick="editRecord(${i})"`}>${ks.map(k=>{const v=r[k];if(/amount|price|balance|rate/i.test(k))return`<td>${money(v)}</td>`;if(/status|active|enabled/i.test(k))return`<td><span class="pill">${esc(v??'')}</span></td>`;return`<td title="${esc(v??'')}">${esc(v??'')}</td>`}).join('')}</tr>`).join('')}</tbody></table></div>`}function filtered(){return rows().filter(r=>JSON.stringify(r).toLowerCase().includes(S.query))}function filter(){S.query=q.value.toLowerCase();tbl.innerHTML=tableHtml(filtered())}
function newRecord(s){S.section=s;S.editing=null;if(s==='settings')return settingsForm();let z={};if(s==='lessons')z={'Duration (h)':1,'Price (€)':Number(S.data.settings?.lessonPricePerHour||65),'Trainer Name':S.data.settings?.instructorName||'','Status':'upcoming'};if(s==='students')z={'Status':'active','Exam Readiness (%)':0};if(s==='payments')z={'Type':'deposit'};if(s==='invoices')z={'Status':'unpaid'};if(s==='packages')z={isActive:'TRUE',popular:'FALSE',recommended:'FALSE'};recordForm(z)}function editRecord(i){const a=S.query?filtered():rows();S.editing=a[i]||null;recordForm(S.editing||{})}function schema(){return S.data.schemas?.[S.section]||[]}function enc(s){return encodeURIComponent(s).replace(/%/g,'_')}function type(h){if(/date of birth|^date$/i.test(h))return'date';if(/^time$|start time|end time/i.test(h))return'time';if(/amount|price|balance|hours|duration|rating|order|readiness|rate/i.test(h))return'number';if(/description|notes|message|features|instructions|policy|footer|answer_/i.test(h))return'textarea';if(/email/i.test(h))return'email';return'text'}function norm(v,t){if(v==null)return'';if(t==='date')return String(v).slice(0,10);if(t==='time')return String(v).match(/\d{2}:\d{2}/)?.[0]||String(v);return v}
function choices(h){if(h==='Student ID'||h==='Target Student ID')return(S.data.students||[]).map(x=>[x['Student ID'],`${x.Name} (${x['Student ID']})`]);if(h==='Trainer ID')return(S.data.trainers||[]).map(x=>[x['Trainer ID'],`${x.Name} (${x['Trainer ID']})`]);if(h==='Trainer Name'&&S.section==='lessons')return(S.data.trainers||[]).map(x=>[x.Name,x.Name]);if(h==='Current Package')return(S.data.packages||[]).filter(x=>String(x.isActive??'TRUE').toLowerCase()!=='false').map(x=>[x.name,x.name]);if(h==='Category ID')return(S.data.expenseCategories||[]).filter(x=>String(x.Active??'TRUE').toLowerCase()!=='false').map(x=>[x['Category ID'],x.Name]);if(h==='Owner Type')return[['student','student'],['trainer','trainer'],['school','school']];if(h==='Owner ID')return[...(S.data.students||[]).map(x=>[x['Student ID'],`${x.Name} — Student`]),...(S.data.trainers||[]).map(x=>[x['Trainer ID'],`${x.Name} — Trainer`])];if(h==='Day of Week')return['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'].map(x=>[x,x]);if(h==='Status'&&S.section==='students')return[['active','active'],['inactive','inactive'],['suspended','suspended']];if(h==='Status'&&S.section==='trainers')return[['active','active'],['inactive','inactive'],['on_leave','on_leave']];if(h==='Status'&&S.section==='lessons')return[['upcoming','upcoming'],['active','active'],['completed','completed'],['cancelled','cancelled']];if(h==='Status'&&S.section==='invoices')return[['unpaid','unpaid'],['paid','paid'],['credited','credited']];if(h==='Status'&&S.section==='availability')return[['available','available'],['blocked','blocked'],['booked','booked']];if(h==='Status'&&S.section==='expenses')return[['planned','planned'],['paid','paid'],['cancelled','cancelled']];if(h==='Status'&&S.section==='documents')return[['active','active'],['archived','archived']];if(h==='Type'&&S.section==='payments')return[['deposit','deposit'],['adjustment','adjustment']];if(h==='Recipient Role')return[['student','student'],['trainer','trainer'],['admin','admin'],['all','all']];if(h==='type'&&S.section==='media')return[['video','video'],['image','image']];if(h==='language')return[['all','all'],['nl','nl'],['en','en'],['ar','ar']];if(['popular','recommended','isActive','Active','isEnabled','isDeletedByTrainer','Read Status','aiCoachEnabled','notificationsEnabled','Is Available','Editable'].includes(h))return[['TRUE','TRUE'],['FALSE','FALSE']];return null}
function isRo(h){if(idHeaders.includes(h))return true;if(S.editing&&S.section==='controlSettings'&&h==='Key')return true;if(S.editing&&S.section==='trainerSchedule'&&['Trainer ID','Day of Week'].includes(h))return true;if(S.editing&&S.section==='lessons'&&['Student ID','Duration (h)','Price (€)'].includes(h))return true;if(S.editing&&S.section==='packages'&&h==='name')return true;return(ro[S.section]||[]).includes(h)}function notice(){if(S.section==='students')return'Student ID is generated automatically. Balance is controlled through Wallet / Deposits.';if(S.section==='lessons')return'New lessons use the existing wallet and lesson rules. Google Calendar remains disabled.';if(S.section==='documents')return'Document metadata only; no Drive files are fabricated or deleted.';if(S.section==='media')return'Media records must reference real URLs or Drive file IDs.';return''}
function recordForm(r){const sc=schema();if(!sc.length)return toast('No schema found for this section.');const n=notice();content.innerHTML=`<div class="card form-card"><div class="fh"><div class="st"><div><b>${S.editing?'Edit':'Add'} ${esc(S.section)}</b><div class="ps">Live record fields</div></div><span>Google Sheets</span></div></div><div class="fb">${n?`<div class="note">${esc(n)}</div>`:''}<div class="form-grid">${sc.map(h=>field(h,r[h]??'')).join('')}</div></div><div class="fa"><button class="btn secondary" onclick="go('${S.section}')">Cancel</button>${S.editing&&!['settings'].includes(S.section)?`<button class="btn danger" onclick="del()">Delete</button>`:''}<button class="btn primary" onclick="save()">Save</button></div></div>`}function field(h,v){const t=type(h),op=choices(h),r=isRo(h),sp=t==='textarea'?' span2':'';if(op)return`<div class="field${sp}"><label>${esc(h)}</label><select id="f_${enc(h)}" ${r?'disabled':''}><option value="">Select…</option>${op.map(x=>`<option value="${esc(x[0])}" ${String(v)===String(x[0])?'selected':''}>${esc(x[1])}</option>`).join('')}</select></div>`;if(t==='textarea')return`<div class="field span2"><label>${esc(h)}</label><textarea id="f_${enc(h)}" ${r?'readonly':''}>${esc(v)}</textarea></div>`;return`<div class="field"><label>${esc(h)}</label><input id="f_${enc(h)}" type="${t}" ${r?'readonly':''} value="${esc(norm(v,t))}" ${(!S.editing&&idHeaders.includes(h))?'placeholder="Generated automatically"':''}></div>`}function collect(){const o={};schema().forEach(h=>{const e=document.getElementById('f_'+enc(h));if(!e){if(S.editing)o[h]=S.editing[h]??'';return}let v=e.value;if(e.type==='number'&&v!=='')v=Number(v);o[h]=v});if(S.editing?.id)o.id=S.editing.id;return o}function save(){loading.style.display='grid';google.script.run.withSuccessHandler(()=>{toast('Saved');S.editing=null;loadData()}).withFailureHandler(fail).controlCenterSaveRecord(S.section,collect())}function del(){if(!S.editing?.id)return toast('Record ID missing.');if(!confirm('Delete this record permanently?'))return;loading.style.display='grid';google.script.run.withSuccessHandler(()=>{toast('Deleted');S.editing=null;loadData()}).withFailureHandler(fail).controlCenterDeleteRecord(S.section,S.editing.id)}function settingsForm(){S.section='settings';S.editing=S.data.settings||{};recordForm(S.editing)}loadData();
</script></body></html>
