<!DOCTYPE html><html><head><base target="_top"><meta name="viewport" content="width=device-width,initial-scale=1"><style>*{box-sizing:border-box}:root{--g:#087443;--ink:#15201b;--muted:#6b7772;--line:#e7ece9;--bg:#f5f7f6}body{margin:0;background:var(--bg);font-family:Arial,Helvetica,sans-serif;color:var(--ink)}button,input{font:inherit}.app{display:flex;min-height:100vh}.side{width:245px;background:linear-gradient(180deg,#063d24,#075d36);color:#fff;padding:18px 14px;position:fixed;inset:0 auto 0 0}.brand{display:flex;align-items:center;gap:10px;padding:8px 8px 22px;border-bottom:1px solid #ffffff1f}.logo{width:42px;height:42px;border-radius:12px;background:#fff;color:var(--g);display:grid;place-items:center;font-weight:900}.brand b{font-size:14px}.brand small{opacity:.7}.nav{padding-top:16px}.nav button{width:100%;border:0;background:transparent;color:#e8f6ef;text-align:left;padding:11px 12px;border-radius:9px;margin:2px 0;cursor:pointer}.nav button:hover,.nav button.active{background:#fff;color:var(--g);font-weight:700}.main{margin-left:245px;flex:1;padding:20px;min-width:0}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}h1{margin:0;font-size:25px}.sub{color:var(--muted);font-size:13px;margin-top:4px}.actions{display:flex;gap:8px}.btn{border:0;border-radius:9px;padding:10px 14px;cursor:pointer;font-weight:700}.primary{background:var(--g);color:#fff}.secondary{background:#fff;border:1px solid var(--line)}.grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:15px;min-width:0}.metric{grid-column:span 1}.metric .label{font-size:11px;color:var(--muted);text-transform:uppercase;font-weight:700}.metric .value{font-size:25px;font-weight:800;margin-top:8px}.metric .hint{font-size:11px;color:var(--g);margin-top:4px}.wide{grid-column:span 4}.half{grid-column:span 3}.full{grid-column:1/-1}.section-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.section-title b{font-size:14px}.section-title span{font-size:11px;color:var(--muted)}table{width:100%;border-collapse:collapse;font-size:12px}th,td{text-align:left;padding:9px 7px;border-bottom:1px solid var(--line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:240px}th{font-size:10px;text-transform:uppercase;color:var(--muted)}.pill{display:inline-block;padding:4px 7px;border-radius:999px;background:#e8f6ef;color:var(--g);font-size:10px;font-weight:700}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}.toolbar input{border:1px solid var(--line);background:#fff;border-radius:8px;padding:9px 10px;min-width:170px}.empty{padding:30px;text-align:center;color:var(--muted)}.loading{position:fixed;inset:0;background:#fffB;display:grid;place-items:center;z-index:20;font-weight:800}.toast{position:fixed;right:20px;bottom:20px;background:#15352a;color:#fff;padding:12px 16px;border-radius:9px;display:none;z-index:30}@media(max-width:1050px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.metric{grid-column:span 1}.wide,.half{grid-column:1/-1}}@media(max-width:720px){.side{position:static;width:100%;height:auto}.app{display:block}.main{margin-left:0}.nav{display:grid;grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.metric,.wide,.half{grid-column:1/-1}.top{align-items:flex-start;flex-direction:column}}</style></head><body><div id="loading" class="loading">Loading control center…</div><div class="app"><aside class="side"><div class="brand"><div class="logo">AR</div><div><b>DRIVING SCHOOL<br>CONTROL CENTER</b><br><small>Master Administration</small></div></div><div class="nav" id="nav"></div></aside><main class="main"><div class="top"><div><h1 id="title">Dashboard</h1><div class="sub" id="sync">Connecting…</div></div><div class="actions"><button class="btn secondary" onclick="loadData()">↻ Sync Now</button><button class="btn primary" onclick="openStudent()">+ New Student</button></div></div><div id="content"></div></main></div><div id="toast" class="toast"></div><script>const S={data:null,section:'dashboard',query:''};const sections=[['dashboard','⌂','Dashboard'],['students','●','Students'],['lessons','▣','Lessons'],['trainers','♟','Instructors'],['packages','◫','Packages'],['invoices','▤','Invoices'],['payments','€','Payments'],['notifications','✉','Notifications']];function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function money(v){return '€'+Number(v||0).toLocaleString(undefined,{minimumFractionDigits:0,maximumFractionDigits:2})}function toast(m){const x=document.getElementById('toast');x.textContent=m;x.style.display='block';setTimeout(()=>x.style.display='none',2500)}function loadData(){document.getElementById('loading').style.display='grid';google.script.run.withSuccessHandler(r=>{S.data=r;document.getElementById('loading').style.display='none';document.getElementById('sync').textContent='Live from Google Sheets · '+new Date(r.generatedAt).toLocaleString();render()}).withFailureHandler(e=>{document.getElementById('loading').style.display='none';toast(e.message||String(e))}).controlCenterGetData()}function renderNav(){document.getElementById('nav').innerHTML=sections.map(s=>`<button class="${S.section===s[0]?'active':''}" onclick="go('${s[0]}')">${s[1]}&nbsp; ${s[2]}</button>`).join('')}function go(s){S.section=s;S.query='';render()}function render(){renderNav();document.getElementById('title').textContent=sections.find(x=>x[0]===S.section)[2];if(S.section==='dashboard')return dashboard();table(S.data[S.section]||[])}function metric(a,b,c){return `<div class="card metric"><div class="label">${a}</div><div class="value">${b}</div><div class="hint">${c}</div></div>`}function mini(rows,cols){if(!rows.length)return '<div class="empty">No records</div>';return `<table><thead><tr>${cols.map(c=>`<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${cols.map(c=>`<td>${c==='amount'||c==='balance'?money(r[c]):esc(r[c])}</td>`).join('')}</tr>`).join('')}</tbody></table>`}function dashboard(){const d=S.data,k=d.dashboard;document.getElementById('content').innerHTML=`<div class="grid">${metric('Total Students',k.totalStudents,k.activeStudents+' active')}${metric("Today's Lessons",k.todayLessons,'scheduled today')}${metric('Monthly Revenue',money(k.monthlyRevenue),'current month')}${metric('Outstanding',money(k.outstandingBalance),'student balances')}${metric('Upcoming Lessons',k.upcomingLessons,'from today')}${metric('Invoices',k.totalInvoices,'records')}<div class="card wide"><div class="section-title"><b>Recent Lessons</b><span>${d.lessons.length} total</span></div>${mini(d.lessons,['date','time','studentId','name','status'])}</div><div class="card half"><div class="section-title"><b>Outstanding Balances</b></div>${mini(d.students.filter(x=>Number(x.balance)<0).slice(0,8),['studentId','name','balance','status'])}</div><div class="card half"><div class="section-title"><b>Recent Payments</b></div>${mini(d.payments.slice(-8).reverse(),['date','studentId','amount','type','desc'])}</div></div>`}function table(rows){document.getElementById('content').innerHTML=`<div class="card full"><div class="toolbar"><input id="q" placeholder="Search…" value="${esc(S.query)}" oninput="filter()">${S.section==='students'?'<button class="btn primary" onclick="openStudent()">+ New Student</button>':''}${S.section==='lessons'?'<button class="btn primary" onclick="openLesson()">+ New Lesson</button>':''}${S.section==='payments'?'<button class="btn primary" onclick="openDeposit()">+ Add Payment</button>':''}${S.section==='invoices'?'<button class="btn primary" onclick="openInvoice()">+ Generate Invoice</button>':''}</div><div id="tbl">${tableHtml(rows)}</div></div>`}function tableHtml(rows){if(!rows.length)return '<div class="empty">No records found.</div>';const p=['id','studentId','name','email','phone','date','time','status','amount','balance'];const keys=[...new Set(rows.flatMap(r=>Object.keys(r)).filter(k=>!k.startsWith('_')&&p.includes(k)))].slice(0,10);return `<table><thead><tr>${keys.map(k=>`<th>${esc(k)}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${keys.map(k=>{const v=r[k];if(k==='amount'||k==='balance')return `<td>${money(v)}</td>`;if(k==='status')return `<td><span class="pill">${esc(v||'—')}</span></td>`;return `<td>${esc(v)}</td>`}).join('')}</tr>`).join('')}</tbody></table>`}function filter(){S.query=document.getElementById('q').value.toLowerCase();document.getElementById('tbl').innerHTML=tableHtml((S.data[S.section]||[]).filter(r=>JSON.stringify(r).toLowerCase().includes(S.query)))}function form(title,fields,fn){document.getElementById('content').innerHTML=`<div class="card" style="max-width:620px;margin:auto"><div class="section-title"><b>${title}</b></div>${fields.map(f=>`<label style="display:block;font-size:11px;font-weight:700;margin:10px 0 5px">${f.label}<input id="f_${f.key}" ${f.type==='number'?'type="number" step="0.01"':'type="text"'} style="width:100%;padding:10px;border:1px solid #e7ece9;border-radius:8px" placeholder="${esc(f.placeholder||'')}"></label>`).join('')}<div class="actions" style="margin-top:14px"><button class="btn secondary" onclick="go('${S.section}')">Cancel</button><button class="btn primary" onclick="${fn}">Save</button></div></div>`}function v(k){return document.getElementById('f_'+k)?.value.trim()||''}function openStudent(){form('Register Student',[{key:'name',label:'Full name'},{key:'email',label:'Email'},{key:'phone',label:'Phone'},{key:'dob',label:'Date of birth'},{key:'city',label:'City'},{key:'package',label:'Package'}],'saveStudent()')}function saveStudent(){google.script.run.withSuccessHandler(()=>{toast('Student created');S.section='students';loadData()}).withFailureHandler(e=>toast(e.message||String(e))).controlCenterCreateStudent({name:v('name'),email:v('email'),phone:v('phone'),dob:v('dob'),city:v('city'),package:v('package')})}function openLesson(){form('Create Lesson',[{key:'studentId',label:'Student ID'},{key:'date',label:'Date'},{key:'time',label:'Time'},{key:'duration',label:'Duration (minutes)',type:'number'},{key:'price',label:'Price',type:'number'},{key:'pickup',label:'Pickup location'}],'saveLesson()')}function saveLesson(){google.script.run.withSuccessHandler(()=>{toast('Lesson created');S.section='lessons';loadData()}).withFailureHandler(e=>toast(e.message||String(e))).controlCenterCreateBooking({studentId:v('studentId'),date:v('date'),time:v('time'),duration:Number(v('duration')||60),price:Number(v('price')||0),pickup:v('pickup')})}function openDeposit(){form('Add Payment',[{key:'studentId',label:'Student ID'},{key:'amount',label:'Amount',type:'number'},{key:'description',label:'Description'}],'saveDeposit()')}function saveDeposit(){google.script.run.withSuccessHandler(()=>{toast('Payment added');S.section='payments';loadData()}).withFailureHandler(e=>toast(e.message||String(e))).controlCenterAddDeposit({studentId:v('studentId'),amount:Number(v('amount')),description:v('description')})}function openInvoice(){form('Generate Invoice',[{key:'studentId',label:'Student ID'},{key:'trainerId',label:'Trainer ID'},{key:'bookingsList',label:'Booking ID(s)'}],'saveInvoice()')}function saveInvoice(){google.script.run.withSuccessHandler(()=>{toast('Invoice generated');S.section='invoices';loadData()}).withFailureHandler(e=>toast(e.message||String(e))).controlCenterCreateInvoice({studentId:v('studentId'),trainerId:v('trainerId'),bookingsList:v('bookingsList')})}loadData();</script></body></html>
