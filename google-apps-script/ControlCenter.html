<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    *{box-sizing:border-box}
    :root{
      --nav:#071a2e;--nav2:#0b2946;--blue:#1473e6;--blue2:#0b5fc2;--green:#16a064;
      --amber:#e89a16;--violet:#7c5ce7;--red:#d94b5a;--cyan:#159fba;--ink:#142238;
      --muted:#6e7f93;--line:#e5ebf2;--line2:#edf1f6;--bg:#f4f7fb;--white:#fff;--danger:#b42318;
      --shadow:0 8px 28px rgba(18,38,63,.065);--shadow2:0 2px 10px rgba(18,38,63,.06)
    }
    html,body{min-height:100%}
    body{margin:0;background:var(--bg);font-family:Inter,"Segoe UI",Arial,sans-serif;color:var(--ink);font-size:13px}
    button,input,select,textarea{font:inherit}
    button{transition:.18s ease}
    .app{display:flex;min-height:100vh}
    .side{width:236px;background:linear-gradient(180deg,var(--nav) 0%,#09233d 58%,#071827 100%);color:#fff;padding:16px 12px;position:fixed;inset:0 auto 0 0;overflow:auto;z-index:30;box-shadow:12px 0 32px rgba(7,26,46,.08)}
    .brand{display:flex;align-items:center;gap:11px;padding:8px 8px 17px;border-bottom:1px solid rgba(255,255,255,.09)}
    .brand-mark{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,#1889ff,#0f65ca);box-shadow:0 8px 20px rgba(20,115,230,.3);font-size:20px}
    .brand-title{font-weight:900;font-size:14px;letter-spacing:.25px}.brand small{display:block;font-weight:600;color:#8fa8c1;font-size:9px;letter-spacing:1.2px;margin-top:4px}
    .nav{padding-top:12px}.nav-group{margin-top:11px}.nav-group:first-child{margin-top:0}.nav-label{font-size:9px;letter-spacing:1.25px;color:#6f8ba7;font-weight:800;padding:7px 10px 5px;text-transform:uppercase}
    .nav button{width:100%;border:0;background:transparent;color:#c7d7e6;text-align:left;padding:9px 10px;border-radius:9px;margin:2px 0;cursor:pointer;display:flex;align-items:center;gap:9px;font-size:11.5px}
    .nav button .nav-ico{width:25px;height:25px;display:grid;place-items:center;border-radius:7px;background:rgba(255,255,255,.055);font-size:13px;flex:0 0 25px}
    .nav button:hover{background:rgba(255,255,255,.07);color:#fff;transform:translateX(1px)}
    .nav button.active{background:linear-gradient(90deg,#1379ee,#106bd4);color:#fff;font-weight:800;box-shadow:0 7px 18px rgba(19,121,238,.2)}
    .nav button.active .nav-ico{background:rgba(255,255,255,.16)}
    .side-foot{margin-top:18px;padding:12px 10px;border-top:1px solid rgba(255,255,255,.08);color:#708da8;font-size:9px;line-height:1.5}

    .main{margin-left:236px;flex:1;min-width:0;padding:0 22px 28px}
    .top{position:sticky;top:0;z-index:20;margin:0 -22px 20px;padding:15px 22px;background:rgba(244,247,251,.92);backdrop-filter:blur(12px);border-bottom:1px solid rgba(226,232,240,.85);display:flex;justify-content:space-between;align-items:center;gap:16px}
    .heading{display:flex;align-items:center;gap:12px}.page-mark{width:37px;height:37px;border-radius:11px;background:#e8f2ff;color:#116bd5;display:grid;place-items:center;font-weight:900;font-size:17px}
    .top h1{margin:0;font-size:21px;letter-spacing:-.35px}.sub{font-size:10.5px;color:var(--muted);margin-top:4px;display:flex;align-items:center;gap:6px}.live-dot{width:7px;height:7px;border-radius:50%;background:#1fb56d;box-shadow:0 0 0 3px rgba(31,181,109,.12)}
    .actions,.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.btn{border:0;border-radius:9px;padding:8px 12px;cursor:pointer;font-weight:800;font-size:11px;display:inline-flex;align-items:center;gap:6px;min-height:34px}
    .btn:hover{transform:translateY(-1px)}.primary{background:linear-gradient(180deg,#1883f2,#126fd8);color:#fff;box-shadow:0 4px 10px rgba(20,115,230,.2)}
    .secondary{background:#fff;border:1px solid var(--line);color:var(--ink);box-shadow:0 1px 2px rgba(15,23,42,.025)}.secondary:hover{border-color:#cdd7e4;background:#fbfcfe}
    .danger{background:#fff2f1;color:var(--danger);border:1px solid #ffd6d2}.green{background:linear-gradient(180deg,#21ad70,#15955f);color:#fff;box-shadow:0 4px 10px rgba(22,160,100,.17)}

    .dashboard-grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:13px}.grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}
    .card{background:#fff;border:1px solid var(--line);border-radius:15px;padding:15px;min-width:0;box-shadow:var(--shadow2)}
    .metric{grid-column:span 2;padding:14px 15px 13px;position:relative;overflow:hidden;min-height:112px}.metric:after{content:"";position:absolute;width:72px;height:72px;border-radius:50%;right:-22px;top:-26px;background:var(--metric-soft,#eef5ff)}
    .metric-head{display:flex;align-items:center;justify-content:space-between;position:relative;z-index:1}.metric-icon{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;background:var(--metric-soft,#eef5ff);color:var(--metric-accent,#1473e6);font-size:15px;font-weight:900}
    .metric .label{font-size:9px;color:var(--muted);font-weight:900;text-transform:uppercase;letter-spacing:.55px;margin-top:12px}.metric .value{font-size:23px;font-weight:900;margin-top:4px;letter-spacing:-.45px;position:relative;z-index:1}.metric .hint{font-size:9.5px;color:var(--muted);margin-top:3px;position:relative;z-index:1}
    .m-blue{--metric-accent:#1473e6;--metric-soft:#eaf3ff}.m-green{--metric-accent:#159b62;--metric-soft:#e9f8f1}.m-amber{--metric-accent:#dd8a0e;--metric-soft:#fff4df}.m-violet{--metric-accent:#7454df;--metric-soft:#f1edff}.m-red{--metric-accent:#d24a59;--metric-soft:#fff0f2}.m-cyan{--metric-accent:#118fa7;--metric-soft:#e9f8fb}
    .span7{grid-column:span 7}.span5{grid-column:span 5}.span6{grid-column:span 6}.wide{grid-column:span 4}.half{grid-column:span 3}.full{grid-column:1/-1}
    .section-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:10px}.section-title b{font-size:13px;letter-spacing:-.1px}.section-title span{font-size:9.5px;color:var(--muted)}.section-title .link{color:var(--blue);font-weight:800;cursor:pointer}
    .panel-sub{font-size:9.5px;color:var(--muted);margin-top:-7px;margin-bottom:10px}
    .quick-actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.quick{border:1px solid var(--line);background:#fbfcfe;border-radius:11px;padding:12px;display:flex;align-items:center;gap:10px;cursor:pointer;color:var(--ink);text-align:left}.quick:hover{background:#f6faff;border-color:#cedbea;transform:translateY(-1px)}.quick-ico{width:31px;height:31px;border-radius:9px;display:grid;place-items:center;background:#edf5ff;color:#1473e6;font-size:14px;flex:0 0 31px}.quick b{font-size:10.5px;display:block}.quick small{display:block;color:var(--muted);font-size:8.5px;margin-top:2px}
    .snapshot{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:13px}.snap{background:#f8fafc;border:1px solid var(--line2);border-radius:10px;padding:10px}.snap b{font-size:16px;display:block}.snap span{font-size:8.5px;color:var(--muted);text-transform:uppercase;font-weight:800;letter-spacing:.45px}

    .scroll{overflow:auto;border-radius:10px;border:1px solid var(--line2)} table{width:100%;border-collapse:separate;border-spacing:0;font-size:11px;background:#fff} th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line2);white-space:nowrap;max-width:280px;overflow:hidden;text-overflow:ellipsis} th{font-size:8.8px;text-transform:uppercase;letter-spacing:.45px;color:#728397;background:#f8fafc;position:sticky;top:0;z-index:2;font-weight:900} tbody tr:last-child td{border-bottom:0} tr.clickable{cursor:pointer}tr.clickable:hover{background:#f8fbff}
    .pill{display:inline-flex;align-items:center;padding:4px 7px;border-radius:999px;background:#edf5ff;color:#1557b0;font-size:9px;font-weight:800;line-height:1}.ok{background:#e8f7ef;color:#137346}.bad{background:#fff0ee;color:#b42318}
    .toolbar{margin-bottom:12px;padding-bottom:12px;border-bottom:1px solid var(--line2)}.search-box{position:relative;min-width:250px;flex:1;max-width:420px}.search-box:before{content:'⌕';position:absolute;left:11px;top:7px;color:#8797a9;font-size:15px}.toolbar input{width:100%;border:1px solid var(--line);border-radius:9px;padding:9px 11px 9px 32px;background:#fbfcfe;outline:0}.toolbar input:focus{border-color:#8abcf2;box-shadow:0 0 0 3px rgba(20,115,230,.08);background:#fff}
    .empty{padding:32px 18px;text-align:center;color:var(--muted);font-size:10.5px}.empty:before{content:'—';display:block;font-size:18px;color:#b5c0cb;margin-bottom:5px}
    .loading{position:fixed;inset:0;background:rgba(247,249,252,.93);display:grid;place-items:center;z-index:40;font-weight:900;color:#24415e}.loading-inner{text-align:center}.spinner{width:34px;height:34px;border:3px solid #dce8f5;border-top-color:var(--blue);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 10px}@keyframes spin{to{transform:rotate(360deg)}}
    .toast{position:fixed;right:20px;bottom:20px;background:#102b45;color:#fff;padding:11px 15px;border-radius:10px;display:none;z-index:50;max-width:420px;box-shadow:0 10px 28px rgba(6,24,40,.24);font-size:11px}

    .form-card{max-width:1040px;margin:auto;padding:0;overflow:hidden}.form-head{padding:17px 18px 13px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,#fff,#fbfcfe)}.form-body{padding:17px 18px}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field label{display:block;font-size:9.5px;font-weight:900;margin-bottom:5px;color:#52657a;letter-spacing:.15px}.field input,.field select,.field textarea{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink);outline:0;font-size:11px}.field input:focus,.field select:focus,.field textarea:focus{border-color:#86b9ef;box-shadow:0 0 0 3px rgba(20,115,230,.075)}.field textarea{min-height:86px;resize:vertical}.field input[readonly],.field input:disabled,.field select:disabled{background:#f3f6f9;color:#7c8b9c}.span2{grid-column:1/-1}.note{padding:10px 12px;background:#eef6ff;border:1px solid #cce2fb;border-radius:10px;font-size:10px;color:#285d96;margin-bottom:13px;line-height:1.45}.form-actions{padding:12px 18px;border-top:1px solid var(--line);background:#fafbfd;display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
    .status-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.status-item{border:1px solid var(--line);border-radius:11px;padding:12px;background:#fff}.status-item b{display:block;font-size:11px;margin-bottom:5px}.status-item small{color:var(--muted);font-size:9.5px;line-height:1.4}

    @media(max-width:1180px){.dashboard-grid{grid-template-columns:repeat(6,1fr)}.metric{grid-column:span 2}.span7,.span5,.span6{grid-column:span 3}.snapshot{grid-template-columns:1fr}.status-grid{grid-template-columns:1fr 1fr}}
    @media(max-width:850px){.side{width:210px}.main{margin-left:210px}.dashboard-grid,.grid{grid-template-columns:repeat(2,1fr)}.metric,.span7,.span5,.span6,.wide,.half{grid-column:1/-1}.quick-actions{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}.actions{width:100%}.status-grid{grid-template-columns:1fr}}
    @media(max-width:650px){.side{position:static;width:100%;max-height:none}.app{display:block}.main{margin-left:0;padding:0 13px 20px}.top{margin:0 -13px 15px;padding:13px}.nav{display:grid;grid-template-columns:repeat(2,1fr);gap:3px}.nav-group{display:contents}.nav-label{grid-column:1/-1}.dashboard-grid,.grid,.form-grid{grid-template-columns:1fr}.metric,.span7,.span5,.span6,.wide,.half,.span2{grid-column:auto}.top .actions .btn{flex:1;justify-content:center}.search-box{min-width:100%;max-width:none}.form-head,.form-body,.form-actions{padding-left:13px;padding-right:13px}}
  </style>
</head>
<body>
<div id="loading" class="loading"><div class="loading-inner"><div class="spinner"></div>Loading Master Control Center…</div></div>
<div class="app">
  <aside class="side">
    <div class="brand"><div class="brand-mark">🚗</div><div><div class="brand-title">TAREK RIJSCHOOL</div><small>MASTER CONTROL CENTER</small></div></div>
    <div class="nav" id="nav"></div>
    <div class="side-foot">TAREK RIJSCHOOL<br>Administrative workspace</div>
  </aside>
  <main class="main">
    <div class="top">
      <div class="heading"><div class="page-mark" id="pageMark">⌂</div><div><h1 id="title">Dashboard</h1><div class="sub"><span class="live-dot"></span><span id="sync">Connecting to Google Sheets…</span></div></div></div>
      <div class="actions"><button class="btn secondary" onclick="loadData()">↻ Sync</button><button class="btn primary" onclick="newRecord('students')">＋ Student</button><button class="btn secondary" onclick="newRecord('lessons')">＋ Lesson</button><button class="btn green" onclick="newRecord('payments')">＋ Deposit</button></div>
    </div>
    <div id="content"></div>
  </main>
</div>
<div id="toast" class="toast"></div>
<script>
const S={data:null,section:'dashboard',query:'',editing:null};
const sections=[
  ['dashboard','⌂ Dashboard'],['students','👤 Students'],['lessons','📅 Lessons'],['trainers','👔 Trainers'],['trainerSchedule','🗓 Trainer Schedule'],['payments','💶 Wallet / Deposits'],['invoices','📄 Invoices'],['packages','📦 Packages'],['notifications','🔔 Notifications'],['availability','⏱ Availability'],['expenseCategories','🗂 Expense Categories'],['expenses','💸 Expenses'],['documents','📁 Documents'],['help','❓ Help & Support'],['media','🎬 Media Library'],['settings','⚙ School Settings'],['controlSettings','🛠 Control Settings'],['audit','🛡 Audit Log'],['status','✓ System Status']
];
const navGroups=[
  ['Overview',['dashboard']],
  ['People',['students','trainers','trainerSchedule']],
  ['Operations',['lessons','availability']],
  ['Finance',['payments','invoices','packages','expenseCategories','expenses']],
  ['Content',['notifications','documents','help','media']],
  ['System',['settings','controlSettings','audit','status']]
];
const idHeaders=['Student ID','Lesson ID','Trainer ID','Transaction ID','Invoice ID','Notification ID','Category ID','Expense ID','Availability ID','Document ID','id','ID'];
const readOnlyFields={students:['Student ID','Balance (€)'],lessons:['Lesson ID','Student Name','Calendar Event ID'],trainers:['Trainer ID'],trainerSchedule:['Trainer Name'],payments:['Transaction ID','Student Name','Date','Drive Invoice URL'],invoices:['Invoice ID','Student Name','Student Email'],notifications:['Notification ID'],expenseCategories:['Category ID'],expenses:['Expense ID','Category Name'],availability:['Availability ID','Trainer Name'],documents:['Document ID','Owner Name','Created At'],help:['ID'],media:['id']};
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function money(v){return '€'+Number(v||0).toLocaleString(undefined,{minimumFractionDigits:0,maximumFractionDigits:2})}
function toast(m){const x=document.getElementById('toast');x.textContent=m;x.style.display='block';setTimeout(()=>x.style.display='none',3200)}
function fail(e){document.getElementById('loading').style.display='none';toast(e?.message||String(e))}
function loadData(){document.getElementById('loading').style.display='grid';google.script.run.withSuccessHandler(r=>{S.data=r;document.getElementById('loading').style.display='none';document.getElementById('sync').textContent='Live Google Sheets · '+new Date(r.generatedAt).toLocaleString();render()}).withFailureHandler(fail).controlCenterGetData()}
function go(s){S.section=s;S.query='';S.editing=null;render()}
function sectionMeta(key){return sections.find(x=>x[0]===key)||[key,key]}
function renderNav(){document.getElementById('nav').innerHTML=navGroups.map(g=>`<div class="nav-group"><div class="nav-label">${esc(g[0])}</div>${g[1].map(key=>{const s=sectionMeta(key),parts=s[1].split(' '),ico=parts.shift(),label=parts.join(' ');return `<button class="${S.section===key?'active':''}" onclick="go('${key}')"><span class="nav-ico">${ico}</span><span>${esc(label)}</span></button>`}).join('')}</div>`).join('')}
function render(){renderNav();const sec=sectionMeta(S.section),parts=sec[1].split(' ');document.getElementById('pageMark').textContent=parts.shift();document.getElementById('title').textContent=parts.join(' ')||S.section;if(S.section==='dashboard')return dashboard();if(S.section==='status')return statusView();if(S.section==='settings')return settingsForm();table(sectionRows())}
function sectionRows(){return (S.data[S.section]||[])}
function metric(icon,a,b,c,cls){return `<div class="card metric ${cls}"><div class="metric-head"><div class="metric-icon">${icon}</div></div><div class="label">${a}</div><div class="value">${b}</div><div class="hint">${c}</div></div>`}
function mini(rows,cols){if(!rows.length)return '<div class="empty">No records yet</div>';return `<div class="scroll"><table><thead><tr>${cols.map(c=>`<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${cols.map(c=>`<td>${/amount|balance|price/i.test(c)?money(r[c]):esc(r[c]??'')}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}
function dashboard(){const d=S.data,k=d.dashboard||{};const outstanding=(d.students||[]).filter(x=>Number(x.balance)<0).slice(0,8);const recentLessons=(d.lessons||[]).slice(-10).reverse();const recentPayments=(d.payments||[]).slice(-8).reverse();document.getElementById('content').innerHTML=`<div class="dashboard-grid">${metric('👤','Total Students',k.totalStudents??0,(k.activeStudents??0)+' active','m-blue')}${metric('📅',"Today's Lessons",k.todayLessons??0,'scheduled today','m-amber')}${metric('€','Monthly Deposits',money(k.monthlyRevenue),'current month','m-green')}${metric('!','Outstanding',money(k.outstandingBalance),'negative balances','m-red')}${metric('↗','Upcoming Lessons',k.upcomingLessons??0,'from today','m-violet')}${metric('▤','Invoices',k.totalInvoices??0,'invoice records','m-cyan')}<section class="card span7"><div class="section-title"><div><b>Recent Lessons</b><div class="panel-sub">Latest lesson activity from the live register</div></div><span>${(d.lessons||[]).length} total</span></div>${mini(recentLessons,['date','time','studentId','name','status'])}</section><section class="card span5"><div class="section-title"><div><b>Quick Actions</b><div class="panel-sub">Common administrative tasks</div></div></div><div class="quick-actions"><button class="quick" onclick="newRecord('students')"><span class="quick-ico">👤</span><span><b>Add Student</b><small>Create student profile</small></span></button><button class="quick" onclick="newRecord('lessons')"><span class="quick-ico">📅</span><span><b>Schedule Lesson</b><small>Add a driving lesson</small></span></button><button class="quick" onclick="newRecord('payments')"><span class="quick-ico">€</span><span><b>Add Deposit</b><small>Record wallet credit</small></span></button><button class="quick" onclick="newRecord('invoices')"><span class="quick-ico">▤</span><span><b>Create Invoice</b><small>Add invoice record</small></span></button></div><div class="snapshot"><div class="snap"><b>${(d.trainers||[]).length}</b><span>Trainers</span></div><div class="snap"><b>${(d.packages||[]).length}</b><span>Packages</span></div><div class="snap"><b>${(d.notifications||[]).length}</b><span>Notifications</span></div></div></section><section class="card span6"><div class="section-title"><div><b>Outstanding Balances</b><div class="panel-sub">Students with a negative balance</div></div><span>${outstanding.length} shown</span></div>${mini(outstanding,['studentId','name','balance','status'])}</section><section class="card span6"><div class="section-title"><div><b>Recent Wallet Activity</b><div class="panel-sub">Latest deposits and adjustments</div></div><span>${(d.payments||[]).length} total</span></div>${mini(recentPayments,['date','studentId','amount','type','desc'])}</section></div>`}
function statusView(){const st=S.data.status||{checks:[]};document.getElementById('content').innerHTML=`<div class="card"><div class="section-title"><div><b>Live schema verification</b><div class="panel-sub">Current Google Sheets structure check</div></div><span class="pill ${st.ok?'ok':'bad'}">${st.ok?'ALL OK':'ATTENTION REQUIRED'}</span></div><div class="status-grid">${(st.checks||[]).map(x=>`<div class="status-item"><b>${esc(x.sheet)} <span class="pill ${x.ok?'ok':'bad'}">${x.ok?'OK':'Mismatch'}</span></b><small>${esc(x.message)}</small></div>`).join('')}</div></div>`}
function canAdd(){return !['audit','status','settings'].includes(S.section)}
function table(rows){document.getElementById('content').innerHTML=`<div class="card full"><div class="section-title"><div><b>${esc(document.getElementById('title').textContent)}</b><div class="panel-sub">${rows.length} record${rows.length===1?'':'s'} in this section</div></div></div><div class="toolbar"><div class="search-box"><input id="q" placeholder="Search this section…" oninput="filter()"></div>${canAdd()?`<button class="btn primary" onclick="newRecord('${S.section}')">＋ Add record</button>`:''}</div><div id="tbl">${tableHtml(rows)}</div></div>`}
function keys(){if(S.section==='audit')return ['Audit ID','User Name','Action','Changed By','Date','Time','Target Record','Source'];return (S.data.schemas?.[S.section]||[]).slice(0,14)}
function tableHtml(rows){if(!rows.length)return '<div class="empty">No records found</div>';const ks=keys();return `<div class="scroll"><table><thead><tr>${ks.map(k=>`<th>${esc(k)}</th>`).join('')}</tr></thead><tbody>${rows.map((r,i)=>`<tr ${S.section==='audit'?'':`class="clickable" onclick="editRecord(${i})"`}>${ks.map(k=>{const v=r[k];if(/amount|price|balance|rate/i.test(k))return `<td>${money(v)}</td>`;if(/status|active|enabled/i.test(k))return `<td><span class="pill">${esc(v??'')}</span></td>`;return `<td title="${esc(v??'')}">${esc(v??'')}</td>`}).join('')}</tr>`).join('')}</tbody></table></div>`}
function filtered(){return sectionRows().filter(r=>JSON.stringify(r).toLowerCase().includes(S.query))}
function filter(){S.query=document.getElementById('q').value.toLowerCase();document.getElementById('tbl').innerHTML=tableHtml(filtered())}
function newRecord(s){S.section=s;S.editing=null;if(s==='settings')return settingsForm();let seed={};if(s==='lessons')seed={'Duration (h)':1,'Price (€)':Number(S.data.settings?.lessonPricePerHour||65),'Trainer Name':S.data.settings?.instructorName||'','Status':'upcoming'};if(s==='students')seed={'Status':'active','Exam Readiness (%)':0};if(s==='payments')seed={'Type':'deposit'};if(s==='invoices')seed={'Status':'unpaid'};if(s==='packages')seed={isActive:'TRUE',popular:'FALSE',recommended:'FALSE'};recordForm(seed)}
function editRecord(i){const rows=S.query?filtered():sectionRows();S.editing=rows[i]||null;if(!S.editing&&S.section==='instructors')S.editing={};recordForm(S.editing||{})}
function schema(){return ((S.data.schemas&&S.data.schemas[S.section])||[])}
function enc(s){return encodeURIComponent(s).replace(/%/g,'_')}
function fieldType(h){if(/date of birth|^date$/i.test(h))return 'date';if(/^time$|start time|end time/i.test(h))return 'time';if(/amount|price|balance|hours|duration|rating|order|readiness|rate/i.test(h))return 'number';if(/description|notes|message|features|instructions|policy|footer|answer_/i.test(h))return 'textarea';if(/email/i.test(h))return 'email';return 'text'}
function norm(v,t){if(v==null)return '';if(t==='date')return String(v).slice(0,10);if(t==='time')return String(v).match(/\d{2}:\d{2}/)?.[0]||String(v);return v}
function choices(h){if(h==='Student ID'||h==='Target Student ID')return (S.data.students||[]).map(x=>[x['Student ID'],`${x.Name} (${x['Student ID']})`]);if(h==='Trainer ID')return (S.data.trainers||[]).map(x=>[x['Trainer ID'],`${x.Name} (${x['Trainer ID']})`]);if(h==='Trainer Name'&&S.section==='lessons')return (S.data.trainers||[]).map(x=>[x.Name,x.Name]);if(h==='Current Package')return (S.data.packages||[]).filter(x=>String(x.isActive??'TRUE').toLowerCase()!=='false').map(x=>[x.name,x.name]);if(h==='Category ID')return (S.data.expenseCategories||[]).filter(x=>String(x.Active??'TRUE').toLowerCase()!=='false').map(x=>[x['Category ID'],x.Name]);if(h==='Owner Type')return [['student','student'],['trainer','trainer'],['school','school']];if(h==='Owner ID')return [...(S.data.students||[]).map(x=>[x['Student ID'],`${x.Name} — Student`]),...(S.data.trainers||[]).map(x=>[x['Trainer ID'],`${x.Name} — Trainer`])];if(h==='Day of Week')return ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'].map(x=>[x,x]);if(h==='Status'&&S.section==='students')return [['active','active'],['inactive','inactive'],['suspended','suspended']];if(h==='Status'&&S.section==='trainers')return [['active','active'],['inactive','inactive'],['on_leave','on_leave']];if(h==='Status'&&S.section==='lessons')return [['upcoming','upcoming'],['active','active'],['completed','completed'],['cancelled','cancelled']];if(h==='Status'&&S.section==='invoices')return [['unpaid','unpaid'],['paid','paid'],['credited','credited']];if(h==='Status'&&S.section==='availability')return [['available','available'],['blocked','blocked'],['booked','booked']];if(h==='Status'&&S.section==='expenses')return [['planned','planned'],['paid','paid'],['cancelled','cancelled']];if(h==='Status'&&S.section==='documents')return [['active','active'],['archived','archived']];if(h==='Type'&&S.section==='payments')return [['deposit','deposit'],['adjustment','adjustment']];if(h==='Recipient Role')return [['student','student'],['trainer','trainer'],['admin','admin'],['all','all']];if(h==='type'&&S.section==='media')return [['video','video'],['image','image']];if(h==='language')return [['all','all'],['nl','nl'],['en','en'],['ar','ar']];if(['popular','recommended','isActive','Active','isEnabled','isDeletedByTrainer','Read Status','aiCoachEnabled','notificationsEnabled','Is Available','Editable'].includes(h))return [['TRUE','TRUE'],['FALSE','FALSE']];return null}
function isReadonly(h){if(idHeaders.includes(h))return true;if(S.editing&&S.section==='controlSettings'&&h==='Key')return true;if(S.editing&&S.section==='trainerSchedule'&&['Trainer ID','Day of Week'].includes(h))return true;if(S.editing&&S.section==='lessons'&&['Student ID','Duration (h)','Price (€)'].includes(h))return true;if(S.editing&&S.section==='packages'&&h==='name')return true;return (readOnlyFields[S.section]||[]).includes(h)}
function formNotice(){if(S.section==='students')return 'Student ID is generated automatically. Balance is ledger-controlled through Wallet / Deposits. Firebase login/password is not stored in Google Sheets.';if(S.section==='lessons')return 'A new lesson checks the student wallet and creates the matching Wallet payment automatically. Google Calendar remains disabled.';if(S.section==='trainers')return 'Trainer ID is generated automatically. Existing lessons keep the trainer name stored on the lesson.';if(S.section==='documents')return 'This stores document metadata only. It never fabricates or deletes the actual Google Drive file.';if(S.section==='media')return 'Media records must point to real URLs or Drive file IDs. No fake media is created.';return ''}
function recordForm(r){const sc=schema();if(!sc.length)return toast('No schema found for this section.');const notice=formNotice();document.getElementById('content').innerHTML=`<div class="card form-card"><div class="form-head"><div class="section-title"><div><b>${S.editing?'Edit':'Add'} ${esc(S.section)}</b><div class="panel-sub">Update the live record fields below</div></div><span>Live Google Sheets</span></div></div><div class="form-body">${notice?`<div class="note">${esc(notice)}</div>`:''}<div class="form-grid">${sc.map(h=>fieldHtml(h,r[h]??'')).join('')}</div></div><div class="form-actions"><button class="btn secondary" onclick="go('${S.section}')">Cancel</button>${S.editing&&!['settings'].includes(S.section)?`<button class="btn danger" onclick="del()">Delete</button>`:''}<button class="btn primary" onclick="save()">Save changes</button></div></div>`}
function fieldHtml(h,v){const t=fieldType(h),op=choices(h),ro=isReadonly(h),span=t==='textarea'?' span2':'';if(op)return `<div class="field${span}"><label>${esc(h)}</label><select id="f_${enc(h)}" ${ro?'disabled':''}><option value="">Select…</option>${op.map(x=>`<option value="${esc(x[0])}" ${String(v)===String(x[0])?'selected':''}>${esc(x[1])}</option>`).join('')}</select></div>`;if(t==='textarea')return `<div class="field span2"><label>${esc(h)}</label><textarea id="f_${enc(h)}" ${ro?'readonly':''}>${esc(v)}</textarea></div>`;return `<div class="field"><label>${esc(h)}</label><input id="f_${enc(h)}" type="${t}" ${ro?'readonly':''} value="${esc(norm(v,t))}" ${(!S.editing&&idHeaders.includes(h))?'placeholder="Generated automatically"':''}></div>`}
function collect(){const o={};schema().forEach(h=>{const el=document.getElementById('f_'+enc(h));if(!el){if(S.editing)o[h]=S.editing[h]??'';return}let v=el.value;if(el.type==='number'&&v!=='')v=Number(v);o[h]=v});if(S.editing?.id)o.id=S.editing.id;return o}
function save(){document.getElementById('loading').style.display='grid';google.script.run.withSuccessHandler(()=>{toast('Saved successfully');S.editing=null;loadData()}).withFailureHandler(fail).controlCenterSaveRecord(S.section,collect())}
function del(){if(!S.editing?.id)return toast('Record ID missing.');if(!confirm('Delete this record permanently? Related data integrity rules will be enforced.'))return;document.getElementById('loading').style.display='grid';google.script.run.withSuccessHandler(()=>{toast('Deleted');S.editing=null;loadData()}).withFailureHandler(fail).controlCenterDeleteRecord(S.section,S.editing.id)}
function settingsForm(){S.section='settings';const r=S.data.settings||{};S.editing=r;recordForm(r)}
loadData();
</script>
</body>
</html>
