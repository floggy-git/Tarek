<!DOCTYPE html><html><head><base target="_top"><meta name="viewport" content="width=device-width,initial-scale=1"><style>*{box-sizing:border-box}:root{--g:#087443;--ink:#15201b;--muted:#6b7772;--line:#e7ece9;--bg:#f5f7f6;--danger:#b42318}body{margin:0;background:var(--bg);font-family:Arial,Helvetica,sans-serif;color:var(--ink)}button,input,textarea{font:inherit}.app{display:flex;min-height:100vh}.side{width:245px;background:linear-gradient(180deg,#063d24,#075d36);color:#fff;padding:18px 14px;position:fixed;inset:0 auto 0 0}.brand{padding:8px 8px 20px;border-bottom:1px solid #ffffff1f;font-weight:900}.brand small{font-weight:400;opacity:.7}.nav{padding-top:14px}.nav button{width:100%;border:0;background:transparent;color:#e8f6ef;text-align:left;padding:10px 12px;border-radius:9px;margin:2px 0;cursor:pointer}.nav button:hover,.nav button.active{background:#fff;color:var(--g);font-weight:700}.main{margin-left:245px;flex:1;padding:20px;min-width:0}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}h1{margin:0;font-size:25px}.sub{color:var(--muted);font-size:13px;margin-top:4px}.actions,.toolbar{display:flex;gap:8px;flex-wrap:wrap}.btn{border:0;border-radius:9px;padding:10px 14px;cursor:pointer;font-weight:700}.primary{background:var(--g);color:#fff}.secondary{background:#fff;border:1px solid var(--line)}.danger{background:#fff1f0;color:var(--danger);border:1px solid #ffd5d2}.grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:15px;min-width:0}.metric .label{font-size:11px;color:var(--muted);font-weight:700}.metric .value{font-size:25px;font-weight:800;margin-top:8px}.metric .hint{font-size:11px;color:var(--g);margin-top:4px}.wide{grid-column:span 4}.half{grid-column:span 3}.full{grid-column:1/-1}.section-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.scroll{overflow:auto}table{width:100%;border-collapse:collapse;font-size:12px}th,td{text-align:left;padding:9px 7px;border-bottom:1px solid var(--line);white-space:nowrap;max-width:260px;overflow:hidden;text-overflow:ellipsis}th{font-size:10px;text-transform:uppercase;color:var(--muted)}tr.clickable{cursor:pointer}tr.clickable:hover{background:#f7fbf9}.pill{display:inline-block;padding:4px 7px;border-radius:999px;background:#e8f6ef;color:var(--g);font-size:10px;font-weight:700}.toolbar{margin-bottom:10px}.toolbar input{border:1px solid var(--line);border-radius:8px;padding:9px 10px;min-width:190px}.empty{padding:30px;text-align:center;color:var(--muted)}.loading{position:fixed;inset:0;background:#fffB;display:grid;place-items:center;z-index:20;font-weight:800}.toast{position:fixed;right:20px;bottom:20px;background:#15352a;color:#fff;padding:12px 16px;border-radius:9px;display:none;z-index:30}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.field label{display:block;font-size:11px;font-weight:700;margin-bottom:5px}.field input,.field textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px}.field textarea{min-height:80px}.span2{grid-column:1/-1}@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}.wide,.half{grid-column:1/-1}}@media(max-width:700px){.side{position:static;width:100%}.app{display:block}.main{margin-left:0}.nav{display:grid;grid-template-columns:repeat(2,1fr)}.grid,.form-grid{grid-template-columns:1fr}.wide,.half,.span2{grid-column:auto}.top{flex-direction:column;align-items:flex-start}}</style></head><body><div id="loading" class="loading">Loading control center…</div><div class="app"><aside class="side"><div class="brand">TAREK RIJSCHOOL<br><small>Master Control Center</small></div><div class="nav" id="nav"></div></aside><main class="main"><div class="top"><div><h1 id="title">Dashboard</h1><div class="sub" id="sync">Connecting…</div></div><div class="actions"><button class="btn secondary" onclick="loadData()">↻ Sync</button><button class="btn primary" onclick="newRecord('students')">+ Student</button></div></div><div id="content"></div></main></div><div id="toast" class="toast"></div><script>
const S={data:null,section:'dashboard',query:'',editing:null};const sections=[['dashboard','⌂ Dashboard'],['students','● Students'],['lessons','▣ Lessons'],['trainers','♟ Instructors'],['trainerSchedule','◷ Instructor Schedule'],['packages','◫ Packages'],['payments','€ Wallet / Deposits'],['invoices','▤ Invoices'],['notifications','✉ Notifications'],['availability','◷ Availability'],['expenses','€ Expenses'],['expenseCategories','▦ Expense Categories'],['documents','▤ Documents'],['settings','⚙ School Settings'],['controlSettings','⚒ Control Settings'],['audit','≡ Audit Log']];const idHeaders=['Student ID','Lesson ID','Trainer ID','Invoice ID','Transaction ID','Notification ID','id'];
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function money(v){return'€'+Number(v||0).toLocaleString(undefined,{maximumFractionDigits:2})}function toast(m){let x=document.getElementById('toast');x.textContent=m;x.style.display='block';setTimeout(()=>x.style.display='none',2600)}function fail(e){document.getElementById('loading').style.display='none';toast(e?.message||String(e))}function loadData(){document.getElementById('loading').style.display='grid';google.script.run.withSuccessHandler(r=>{S.data=r;document.getElementById('loading').style.display='none';document.getElementById('sync').textContent='Live Google Sheets · '+new Date(r.generatedAt).toLocaleString();render()}).withFailureHandler(fail).controlCenterGetData()}function go(s){S.section=s;S.query='';S.editing=null;render()}function renderNav(){document.getElementById('nav').innerHTML=sections.map(s=>`<button class="${S.section===s[0]?'active':''}" onclick="go('${s[0]}')">${s[1]}</button>`).join('')}function render(){renderNav();document.getElementById('title').textContent=sections.find(x=>x[0]===S.section)?.[1].replace(/^\S+\s/,'')||S.section;if(S.section==='dashboard')return dashboard();table(S.data[S.section]||[])}
function metric(a,b,c){return`<div class="card metric"><div class="label">${a}</div><div class="value">${b}</div><div class="hint">${c}</div></div>`}function mini(rows,cols){if(!rows.length)return'<div class="empty">No records</div>';return`<div class="scroll"><table><thead><tr>${cols.map(c=>`<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${cols.map(c=>`<td>${/amount|balance/i.test(c)?money(r[c]):esc(r[c])}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}function dashboard(){let d=S.data,k=d.dashboard;document.getElementById('content').innerHTML=`<div class="grid">${metric('Students',k.totalStudents,k.activeStudents+' active')}${metric("Today's lessons",k.todayLessons,'today')}${metric('Revenue',money(k.monthlyRevenue),'this month')}${metric('Outstanding',money(k.outstandingBalance),'balances')}${metric('Upcoming',k.upcomingLessons,'lessons')}${metric('Invoices',k.totalInvoices,'records')}<div class="card wide"><div class="section-title"><b>Recent Lessons</b></div>${mini(d.lessons.slice(-10).reverse(),['date','time','studentId','name','status'])}</div><div class="card half"><div class="section-title"><b>Recent Wallet Activity</b></div>${mini(d.payments.slice(-8).reverse(),['date','studentId','amount','type'])}</div><div class="card half"><div class="section-title"><b>Instructors</b></div>${mini(d.trainers.slice(0,8),['id','name','email','status'])}</div></div>`}
function writable(){return!['audit'].includes(S.section)}function table(rows){document.getElementById('content').innerHTML=`<div class="card full"><div class="toolbar"><input id="q" placeholder="Search…" oninput="filter()">${writable()?`<button class="btn primary" onclick="newRecord('${S.section}')">+ Add</button>`:''}</div><div id="tbl">${tableHtml(rows)}</div></div>`}function keys(){if(S.section==='audit')return['Audit ID','User Name','Action','Changed By','Date','Time','Target Record','Source'];return(S.data.schemas?.[S.section]||[]).slice(0,12)}function tableHtml(rows){if(!rows.length)return'<div class="empty">No records found.</div>';let ks=keys();return`<div class="scroll"><table><thead><tr>${ks.map(k=>`<th>${esc(k)}</th>`).join('')}</tr></thead><tbody>${rows.map((r,i)=>`<tr ${S.section==='audit'?'':`class="clickable" onclick="editRecord(${i})"`}>${ks.map(k=>`<td>${/amount|price|balance|rate/i.test(k)?money(r[k]):/status|active|available/i.test(k)?`<span class="pill">${esc(r[k]??'')}</span>`:esc(r[k]??'')}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}function filtered(){return(S.data[S.section]||[]).filter(r=>JSON.stringify(r).toLowerCase().includes(S.query))}function filter(){S.query=document.getElementById('q').value.toLowerCase();document.getElementById('tbl').innerHTML=tableHtml(filtered())}
function newRecord(s){S.section=s;S.editing=null;if(s==='settings'&&S.data.settings.length)S.editing=S.data.settings[0];recordForm(S.editing||{})}function editRecord(i){let rows=S.query?filtered():(S.data[S.section]||[]);S.editing=rows[i];recordForm(S.editing||{})}function ftype(h){if(/date of birth|^date$/i.test(h))return'date';if(/time$/i.test(h))return'time';if(/amount|price|balance|hours|duration|rating|order|readiness|rate/i.test(h))return'number';if(/description|notes|message|features|instructions|policy|footer/i.test(h))return'textarea';return'text'}function enc(s){return encodeURIComponent(s).replace(/%/g,'_')}function norm(v,t){if(v==null)return'';if(t==='date')return String(v).slice(0,10);if(t==='time')return String(v).match(/\d{2}:\d{2}/)?.[0]||String(v);return v}function options(h){if(h==='Student ID')return(S.data.students||[]).map(x=>[x['Student ID'],x.Name]);if(h==='Trainer ID')return(S.data.trainers||[]).map(x=>[x['Trainer ID'],x.Name]);if(h==='Current Package')return(S.data.packages||[]).filter(x=>String(x.isActive??x.status??'true').toLowerCase()!=='false').map(x=>[x.id,x.name]);if(h==='Category ID')return(S.data.expenseCategories||[]).map(x=>[x['Category ID'],x.Name]);return null}function recordForm(r){let schema=S.data.schemas?.[S.section]||[];if(!schema.length)return toast('No schema found for this section.');document.getElementById('content').innerHTML=`<div class="card" style="max-width:900px;margin:auto"><div class="section-title"><b>${S.editing?'Edit':'Add'} record</b><span>${esc(S.section)}</span></div><div class="form-grid">${schema.map(h=>{let t=ftype(h),v=r[h]??'',disabled=!S.editing&&idHeaders.includes(h);let op=options(h);return op?`<div class="field"><label>${esc(h)}</label><select id="f_${enc(h)}" ${disabled?'disabled':''} style="width:100%;padding:10px;border:1px solid var(--line);border-radius:8px"><option value="">Select…</option>${op.map(x=>`<option value="${esc(x[0])}" ${String(v)===String(x[0])?'selected':''}>${esc(x[1]||x[0])}</option>`).join('')}</select></div>`:t==='textarea'?`<div class="field span2"><label>${esc(h)}</label><textarea id="f_${enc(h)}">${esc(v)}</textarea></div>`:`<div class="field"><label>${esc(h)}</label><input id="f_${enc(h)}" type="${t}" ${disabled?'disabled placeholder="Generated automatically"':''} value="${esc(norm(v,t))}"></div>`}).join('')}</div><div class="actions" style="margin-top:16px"><button class="btn secondary" onclick="go('${S.section}')">Cancel</button>${S.editing&&S.section!=='settings'?`<button class="btn danger" onclick="del()">Delete</button>`:''}<button class="btn primary" onclick="save()">Save</button></div></div>`}function collect(){let o={};(S.data.schemas?.[S.section]||[]).forEach(h=>{let el=document.getElementById('f_'+enc(h));if(!el){if(S.editing)o[h]=S.editing[h]??'';return}let v=el.value;if(el.type==='number'&&v!=='')v=Number(v);o[h]=v});if(S.editing?.id)o.id=S.editing.id;return o}function save(){document.getElementById('loading').style.display='grid';google.script.run.withSuccessHandler(()=>{toast('Saved');S.editing=null;loadData()}).withFailureHandler(fail).controlCenterSaveRecord(S.section,collect())}function del(){if(!S.editing?.id)return toast('Record ID missing.');if(!confirm('Delete this record permanently?'))return;document.getElementById('loading').style.display='grid';google.script.run.withSuccessHandler(()=>{toast('Deleted');S.editing=null;loadData()}).withFailureHandler(fail).controlCenterDeleteRecord(S.section,S.editing.id)}loadData();
</script></body></html>
