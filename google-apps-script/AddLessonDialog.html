<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
    }
  </style>
</head>
<body class="bg-[#0f172a] text-slate-100 min-h-screen flex flex-col p-6">
  <!-- Title Header Banner -->
  <div class="flex items-center gap-3 border-b border-slate-700 pb-4 mb-6">
    <div class="p-2.5 bg-amber-500/10 rounded-xl border border-amber-500/20">
      <span class="text-xl">📅</span>
    </div>
    <div>
      <h2 class="text-lg font-extrabold tracking-tight text-white">Al-Andalos Driving Academy</h2>
      <p class="text-xs text-amber-500 font-medium">ERP Lesson Scheduler Wizard</p>
    </div>
  </div>

  <!-- Loading state -->
  <div id="loader" class="flex flex-col items-center justify-center flex-1 py-12 space-y-3">
    <div class="animate-spin rounded-full h-8 w-8 border-4 border-amber-500 border-t-transparent"></div>
    <p class="text-xs text-slate-400">Loading students and instructors database...</p>
  </div>

  <!-- Main Content Form (Initially Hidden) -->
  <form id="bookingForm" class="hidden space-y-4 flex-1 flex flex-col" onsubmit="submitForm(event)">
    <div class="space-y-4">
      <div>
        <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">Select Student</label>
        <select id="studentId" required class="w-full bg-[#1e293b] border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-amber-500">
          <option value="">-- Choose Student --</option>
        </select>
      </div>

      <div>
        <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">Select Instructor</label>
        <select id="trainerId" required class="w-full bg-[#1e293b] border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-amber-500">
          <option value="">-- Choose Instructor --</option>
        </select>
      </div>

      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">Lesson Date</label>
          <input type="date" id="date" required class="w-full bg-[#1e293b] border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-amber-500">
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">Start Time</label>
          <input type="time" id="time" required class="w-full bg-[#1e293b] border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-amber-500">
        </div>
      </div>

      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">Duration (Hours)</label>
          <select id="duration" class="w-full bg-[#1e293b] border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-amber-500">
            <option value="1">1 Hour</option>
            <option value="1.5">1.5 Hours</option>
            <option value="2">2 Hours</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">Pickup Location</label>
          <input type="text" id="pickupLocation" required class="w-full bg-[#1e293b] border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-amber-500" placeholder="e.g. Sloterdijk Station">
        </div>
      </div>
    </div>

    <!-- Actions -->
    <div class="pt-4 border-t border-slate-700 mt-auto flex items-center justify-end gap-3">
      <button type="button" onclick="google.script.host.close()" class="px-4 py-2 text-xs font-bold text-slate-400 hover:text-white transition duration-150">
        Cancel
      </button>
      <button type="submit" id="submitBtn" class="bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold text-xs px-5 py-2.5 rounded-lg transition duration-150 flex items-center gap-2">
        <span id="btnText">Schedule Lesson</span>
        <div id="spinner" class="hidden animate-spin rounded-full h-3.5 w-3.5 border-2 border-slate-950 border-t-transparent"></div>
      </button>
    </div>
  </form>

  <!-- Error/Success Alerts -->
  <div id="alertBox" class="hidden mt-4 p-3 rounded-lg text-xs font-semibold"></div>

  <script>
    // Fetch data immediately when dialogue displays
    window.onload = function() {
      google.script.run
        .withSuccessHandler(populateDropdowns)
        .withFailureHandler(handleInitError)
        .apiGetStudentsAndTrainers();
    };

    function populateDropdowns(data) {
      document.getElementById('loader').classList.add('hidden');
      document.getElementById('bookingForm').classList.remove('hidden');

      const studentSel = document.getElementById('studentId');
      data.students.forEach(st => {
        const opt = document.createElement('option');
        opt.value = st.id;
        opt.textContent = st.name + " (" + st.id + ") — Balance: €" + st.balance;
        studentSel.appendChild(opt);
      });

      const trainerSel = document.getElementById('trainerId');
      data.trainers.forEach(tr => {
        const opt = document.createElement('option');
        opt.value = tr.id;
        opt.textContent = tr.name + " (" + tr.id + ")";
        trainerSel.appendChild(opt);
      });
    }

    function handleInitError(error) {
      document.getElementById('loader').classList.add('hidden');
      const alertBox = document.getElementById('alertBox');
      alertBox.className = "mt-4 p-3 rounded-lg text-xs font-semibold bg-rose-500/20 text-rose-400 border border-rose-500/30";
      alertBox.textContent = "❌ Failed to fetch database records: " + error.message;
      alertBox.classList.remove('hidden');
    }

    function submitForm(event) {
      event.preventDefault();
      
      const submitBtn = document.getElementById('submitBtn');
      const btnText = document.getElementById('btnText');
      const spinner = document.getElementById('spinner');
      const alertBox = document.getElementById('alertBox');

      submitBtn.disabled = true;
      btnText.textContent = "Scheduling...";
      spinner.classList.remove('hidden');
      alertBox.classList.add('hidden');

      const params = {
        studentId: document.getElementById('studentId').value,
        trainerId: document.getElementById('trainerId').value,
        date: document.getElementById('date').value,
        time: document.getElementById('time').value,
        duration: document.getElementById('duration').value,
        pickupLocation: document.getElementById('pickupLocation').value
      };

      google.script.run
        .withSuccessHandler(function(response) {
          submitBtn.disabled = false;
          btnText.textContent = "Schedule Lesson";
          spinner.classList.add('hidden');
          
          alertBox.className = "mt-4 p-3 rounded-lg text-xs font-semibold bg-emerald-500/20 text-emerald-400 border border-emerald-500/30";
          alertBox.innerHTML = "🎉 Lesson scheduled successfully! Booking ID: " + response.bookingId + "<br>Calendar event and notification dispatched.";
          alertBox.classList.remove('hidden');

          document.getElementById('bookingForm').reset();
          
          setTimeout(function() {
            google.script.host.close();
          }, 3000);
        })
        .withFailureHandler(function(error) {
          submitBtn.disabled = false;
          btnText.textContent = "Schedule Lesson";
          spinner.classList.add('hidden');

          alertBox.className = "mt-4 p-3 rounded-lg text-xs font-semibold bg-rose-500/20 text-rose-400 border border-rose-500/30";
          alertBox.textContent = "❌ Reservation Failed: " + error.message;
          alertBox.classList.remove('hidden');
        })
        .apiCreateBooking(params);
    }
  </script>
</body>
</html>
