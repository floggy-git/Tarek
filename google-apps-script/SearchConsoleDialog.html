<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
    }
    /* Simple custom scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #1e293b;
    }
    ::-webkit-scrollbar-thumb {
      background: #475569;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #64748b;
    }
  </style>
</head>
<body class="bg-[#0f172a] text-slate-100 min-h-screen flex flex-col p-6 overflow-hidden">
  <!-- Header Title -->
  <div class="flex items-center justify-between border-b border-slate-700 pb-4 mb-5">
    <div class="flex items-center gap-3">
      <div class="p-2.5 bg-amber-500/10 rounded-xl border border-amber-500/20">
        <span class="text-xl">🔍</span>
      </div>
      <div>
        <h2 class="text-base font-extrabold tracking-tight text-white">Al-Andalos ERP Control</h2>
        <p class="text-xs text-amber-500 font-medium">Interactive Administrative Search Console</p>
      </div>
    </div>
    <button onclick="google.script.host.close()" class="text-slate-400 hover:text-white text-xs font-semibold px-2 py-1 bg-slate-800 rounded">
      Close Console
    </button>
  </div>

  <!-- Search Filter Controls -->
  <div class="grid grid-cols-1 md:grid-cols-3 gap-3 mb-4">
    <div class="relative">
      <input type="text" id="searchInput" oninput="performSearch()" class="w-full bg-[#1e293b] border border-slate-700 rounded-lg pl-8 pr-3 py-1.5 text-xs text-slate-100 focus:outline-none focus:border-amber-500" placeholder="Search student name, ID or email...">
      <span class="absolute left-2.5 top-2 text-slate-400 text-xs">🔍</span>
    </div>
    <div>
      <select id="typeFilter" onchange="performSearch()" class="w-full bg-[#1e293b] border border-slate-700 rounded-lg px-3 py-1.5 text-xs text-slate-100 focus:outline-none focus:border-amber-500">
        <option value="all">View Mode: All Records</option>
        <option value="students">Students Profiles Only</option>
        <option value="bookings">Lesson Bookings Only</option>
      </select>
    </div>
    <div>
      <select id="statusFilter" onchange="performSearch()" class="w-full bg-[#1e293b] border border-slate-700 rounded-lg px-3 py-1.5 text-xs text-slate-100 focus:outline-none focus:border-amber-500">
        <option value="all">All Statuses</option>
        <option value="active">Active Students</option>
        <option value="upcoming">Upcoming Bookings</option>
        <option value="completed">Completed Bookings</option>
      </select>
    </div>
  </div>

  <!-- Loading Screen -->
  <div id="loader" class="flex flex-col items-center justify-center flex-1 py-12 space-y-3">
    <div class="animate-spin rounded-full h-8 w-8 border-4 border-amber-500 border-t-transparent"></div>
    <p class="text-xs text-slate-400">Querying spreadsheet data index...</p>
  </div>

  <!-- Search Results Area -->
  <div id="resultsWrapper" class="hidden flex-1 overflow-y-auto min-h-0 pr-1 space-y-3">
    <!-- Student Section -->
    <div id="studentsSection">
      <h3 class="text-xs font-extrabold text-amber-500 uppercase tracking-wider mb-2 flex items-center gap-1.5">
        <span>👤</span> Student Accounts (<span id="studentsCount">0</span>)
      </h3>
      <div id="studentsList" class="space-y-2">
        <!-- Dyn contents -->
      </div>
    </div>

    <!-- Bookings Section -->
    <div id="bookingsSection" class="pt-2">
      <h3 class="text-xs font-extrabold text-indigo-400 uppercase tracking-wider mb-2 flex items-center gap-1.5">
        <span>📅</span> Lesson Reservations (<span id="bookingsCount">0</span>)
      </h3>
      <div id="bookingsList" class="space-y-2">
        <!-- Dyn contents -->
      </div>
    </div>

    <div id="noResults" class="hidden flex flex-col items-center justify-center py-10 text-center">
      <span class="text-3xl mb-2">📭</span>
      <p class="text-xs text-slate-400 font-medium">No matching records found.</p>
    </div>
  </div>

  <!-- Alert feedback overlay -->
  <div id="toastBox" class="hidden fixed bottom-6 left-6 right-6 p-3 rounded-lg text-xs font-bold text-center z-50 transition duration-300"></div>

  <script>
    let dbData = { students: [], bookings: [] };

    window.onload = function() {
      fetchData();
    };

    function fetchData() {
      google.script.run
        .withSuccessHandler(function(data) {
          dbData = data;
          document.getElementById('loader').classList.add('hidden');
          document.getElementById('resultsWrapper').classList.remove('hidden');
          performSearch();
        })
        .withFailureHandler(function(err) {
          document.getElementById('loader').classList.add('hidden');
          showToast("❌ Failed to query database: " + err.message, "rose");
        })
        .apiGetAllData();
    }

    function showToast(message, type) {
      const toast = document.getElementById('toastBox');
      toast.textContent = message;
      if (type === "emerald") {
        toast.className = "fixed bottom-6 left-6 right-6 p-3 rounded-lg text-xs font-bold text-center z-50 bg-emerald-500 text-slate-950 shadow-xl";
      } else {
        toast.className = "fixed bottom-6 left-6 right-6 p-3 rounded-lg text-xs font-bold text-center z-50 bg-rose-500 text-white shadow-xl";
      }
      toast.classList.remove('hidden');
      setTimeout(function() {
        toast.classList.add('hidden');
      }, 3500);
    }

    function performSearch() {
      const q = document.getElementById('searchInput').value.trim().toLowerCase();
      const type = document.getElementById('typeFilter').value;
      const status = document.getElementById('statusFilter').value;

      const filteredStudents = dbData.students.filter(st => {
        if (type === 'bookings') return false;
        
        const matchesQuery = st.name.toLowerCase().includes(q) || 
                             st.id.toLowerCase().includes(q) || 
                             st.email.toLowerCase().includes(q) ||
                             st.city.toLowerCase().includes(q);
                             
        const matchesStatus = status === 'all' || 
                              (status === 'active' && st.status === 'active');
                              
        return matchesQuery && matchesStatus;
      });

      const filteredBookings = dbData.bookings.filter(bk => {
        if (type === 'students') return false;
        
        const matchesQuery = bk.bookingId.toLowerCase().includes(q) || 
                             bk.studentName.toLowerCase().includes(q) || 
                             bk.trainerName.toLowerCase().includes(q) ||
                             bk.studentId.toLowerCase().includes(q);
                             
        const matchesStatus = status === 'all' || 
                              (status === bk.status);
                              
        return matchesQuery && matchesStatus;
      });

      renderStudents(filteredStudents);
      renderBookings(filteredBookings);

      const hasStudents = filteredStudents.length > 0;
      const hasBookings = filteredBookings.length > 0;

      document.getElementById('studentsSection').style.display = hasStudents ? 'block' : 'none';
      document.getElementById('bookingsSection').style.display = hasBookings ? 'block' : 'none';
      
      const noResults = document.getElementById('noResults');
      if (!hasStudents && !hasBookings) {
        noResults.classList.remove('hidden');
      } else {
        noResults.classList.add('hidden');
      }
    }

    function renderStudents(students) {
      document.getElementById('studentsCount').textContent = students.length;
      const list = document.getElementById('studentsList');
      list.innerHTML = "";

      students.forEach(st => {
        const item = document.createElement('div');
        item.className = "bg-[#1e293b]/70 border border-slate-800 rounded-xl p-3 flex flex-col md:flex-row justify-between items-start md:items-center gap-3 hover:border-slate-700 transition duration-150";
        
        // Left
        const left = document.createElement('div');
        left.innerHTML = `
          <div class="flex items-center gap-2">
            <span class="text-sm font-extrabold text-white">${st.name}</span>
            <span class="text-[9px] font-bold px-1.5 py-0.5 bg-slate-800 text-slate-400 rounded">${st.id}</span>
            <span class="text-[9px] font-bold px-1.5 py-0.5 bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 rounded-full uppercase">${st.status}</span>
          </div>
          <div class="text-[10px] text-slate-400 mt-1 space-y-0.5">
            <div>✉️ ${st.email} • 📱 ${st.phone}</div>
            <div>📍 Location: ${st.city} • 📦 Package: <span class="text-amber-500 font-bold">${st.package}</span></div>
          </div>
        `;

        // Right (Actions)
        const right = document.createElement('div');
        right.className = "flex items-center gap-2 self-stretch md:self-auto justify-end border-t border-slate-800 pt-2 md:pt-0 md:border-0";
        
        // Deposit button
        const btnDeposit = document.createElement('button');
        btnDeposit.className = "px-2 py-1 text-[10px] font-bold bg-amber-500 hover:bg-amber-600 text-slate-950 rounded transition";
        btnDeposit.textContent = "💰 Deposit";
        btnDeposit.onclick = function() {
          triggerAction("deposit", { studentId: st.id, name: st.name });
        };
        
        // Balance label
        const balLabel = document.createElement('div');
        balLabel.className = "text-right mr-2";
        balLabel.innerHTML = `
          <div class="text-[9px] font-bold text-slate-400 uppercase">Balance</div>
          <div class="text-xs font-extrabold text-emerald-400">€${st.balance}</div>
        `;

        right.appendChild(balLabel);
        right.appendChild(btnDeposit);

        item.appendChild(left);
        item.appendChild(right);
        list.appendChild(item);
      });
    }

    function renderBookings(bookings) {
      document.getElementById('bookingsCount').textContent = bookings.length;
      const list = document.getElementById('bookingsList');
      list.innerHTML = "";

      bookings.forEach(bk => {
        const item = document.createElement('div');
        item.className = "bg-[#1e293b]/70 border border-slate-800 rounded-xl p-3 flex flex-col md:flex-row justify-between items-start md:items-center gap-3 hover:border-slate-700 transition duration-150";

        // Status styling
        const isUpcoming = bk.status === 'upcoming';
        const badgeColor = isUpcoming 
          ? "bg-blue-500/10 text-blue-400 border border-blue-500/20" 
          : "bg-slate-500/10 text-slate-400 border border-slate-500/20";

        // Left
        const left = document.createElement('div');
        left.innerHTML = `
          <div class="flex items-center gap-2">
            <span class="text-sm font-extrabold text-slate-200">Student: ${bk.studentName}</span>
            <span class="text-[9px] font-bold px-1.5 py-0.5 bg-slate-800 text-slate-400 rounded">${bk.bookingId}</span>
            <span class="text-[9px] font-bold px-1.5 py-0.5 rounded-full uppercase ${badgeColor}">${bk.status}</span>
          </div>
          <div class="text-[10px] text-slate-400 mt-1 space-y-0.5">
            <div>👤 Instructor: <span class="text-white font-medium">${bk.trainerName}</span></div>
            <div>📅 Schedule: <strong>${bk.date}</strong> at <strong>${bk.time}</strong> (${bk.duration} hours)</div>
            <div>📍 Pickup: ${bk.pickup}</div>
          </div>
        `;

        // Right (Actions)
        const right = document.createElement('div');
        right.className = "flex items-center gap-2 self-stretch md:self-auto justify-end border-t border-slate-800 pt-2 md:pt-0 md:border-0";

        if (isUpcoming) {
          const btnComplete = document.createElement('button');
          btnComplete.className = "px-2 py-1 text-[10px] font-bold bg-emerald-500 hover:bg-emerald-600 text-slate-950 rounded transition";
          btnComplete.textContent = "✅ Complete Lesson";
          btnComplete.onclick = function() {
            triggerAction("complete", { bookingId: bk.bookingId, studentName: bk.studentName });
          };
          right.appendChild(btnComplete);
        } else {
          const finishedLabel = document.createElement('span');
          finishedLabel.className = "text-[10px] font-bold text-slate-500 italic";
          finishedLabel.textContent = "Lesson finished";
          right.appendChild(finishedLabel);
        }

        item.appendChild(left);
        item.appendChild(right);
        list.appendChild(item);
      });
    }

    function triggerAction(action, data) {
      if (action === "deposit") {
        // We prompt the user for the amount inside a standard prompt of sheet
        google.script.run.host.close();
        google.script.run.menuAddDepositFromId(data.studentId);
      } else if (action === "complete") {
        const confirmed = confirm("Are you sure you want to mark lesson booking " + data.bookingId + " for " + data.studentName + " as completed?");
        if (!confirmed) return;
        
        showToast("Completing lesson and syncing sheets...", "emerald");
        google.script.run
          .withSuccessHandler(function(response) {
            showToast("🎉 Lesson booking " + data.bookingId + " has been successfully completed!", "emerald");
            fetchData();
          })
          .withFailureHandler(function(err) {
            showToast("❌ Completion failed: " + err.message, "rose");
          })
          .apiCompleteBookingProgrammatic(data.bookingId);
      }
    }
  </script>
</body>
</html>
