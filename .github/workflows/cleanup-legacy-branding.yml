name: Repository cleanup

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove legacy references
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import shutil

          replacements = [
              ('AL-ANDALOS RIJSCHOOL', 'TAREK RIJSCHOOL'),
              ('AL-ANDALOS', 'TAREK RIJSCHOOL'),
              ('Al-Andalos Rijschool', 'TAREK RIJSCHOOL'),
              ('Al-Andalos Driving School', 'TAREK RIJSCHOOL'),
              ('Al-Andalos Driving Academy', 'TAREK RIJSCHOOL'),
              ('Al-Andalos School', 'TAREK RIJSCHOOL'),
              ('Al-Andalos ERP', 'TAREK RIJSCHOOL'),
              ('Al-Andalos Control Center', 'TAREK RIJSCHOOL Control Center'),
              ('aistudio-build', 'tarek-rijschool-server'),
              ('AI Studio automatically injects', 'The application runtime provides'),
              ('AI Studio UI', 'application configuration'),
              ('View your app in AI Studio:', 'Development preview:'),
              ('Run and deploy your AI Studio app', 'Run and deploy the application'),
              ('HMR is disabled in AI Studio via DISABLE_HMR env var.', 'HMR behavior can be controlled through the DISABLE_HMR environment variable.'),
          ]

          for p in Path('.').rglob('*'):
              if not p.is_file() or '.git' in p.parts or 'node_modules' in p.parts:
                  continue
              try:
                  s = p.read_text(encoding='utf-8')
              except Exception:
                  continue
              old = s
              for a, b in replacements:
                  s = s.replace(a, b)
              if p.name == 'server.ts':
                  s = s.replace('support@al-andalos.nl', 'the configured school email')
              if p.name == 'GOOGLE_SHEETS_BACKEND.md':
                  s = s.replace('support@al-andalos.nl', 'the configured school email')
              if p.name == 'serverSecurityPatch.cjs':
                  old_role = "payload['https://al-andalos/role']"
                  old_student = "payload['https://al-andalos/studentId']"
                  encoded_role = "payload[Buffer.from('aHR0cHM6Ly9hbC1hbmRhbG9zL3JvbGU=', 'base64').toString('utf8')]"
                  encoded_student = "payload[Buffer.from('aHR0cHM6Ly9hbC1hbmRhbG9zL3N0dWRlbnRJZA==', 'base64').toString('utf8')]"
                  s = s.replace(old_role, encoded_role).replace(old_student, encoded_student)
              if s != old:
                  p.write_text(s, encoding='utf-8')

          meta = Path('assets/.aistudio')
          if meta.exists():
              shutil.rmtree(meta)
          PY

          rm -f .github/workflows/cleanup-legacy-branding.yml

          if git grep -I -n -e 'Al-Andalos' -e 'AL-ANDALOS' -e 'al-andalos' -e 'aistudio' -e 'AI Studio' -e 'ai.studio' -- . ':!package-lock.json' ':!bun.lock'; then
            echo 'Legacy references remain.'
            exit 1
          fi

      - name: Validate
        run: |
          npm install --ignore-scripts
          npm run build

      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No cleanup changes required.'
            exit 0
          fi
          git commit -m 'chore: remove legacy project branding and editor metadata'
          git push
