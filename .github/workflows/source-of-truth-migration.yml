name: Source of Truth Migration

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply safe source-of-truth migration
        run: |
          node scripts/fix_google_sheets_source_of_truth.cjs
          node scripts/fix_password_reset_security.cjs
          node scripts/fix_email_record_id.cjs
          node scripts/fix_send_email_security.cjs
      - name: Commit migration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/utils/googleSheets.ts server.ts
          if git diff --cached --quiet; then echo 'No changes required.'; exit 0; fi
          git commit -m 'fix: enforce canonical Sheets and email security'
          git push
