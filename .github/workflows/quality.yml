name: Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Safe production repair pass
        run: |
          set +e
          node scripts/production_repair.cjs
          code=$?
          set -e
          if [ "$code" -ne 0 ] && [ "$code" -ne 10 ]; then exit "$code"; fi
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add server.ts src/utils/googleSheets.ts src/data.ts src/utils/googleSheetsControlCenter.ts scripts/production_repair.cjs .github/workflows/quality.yml
            git commit -m "fix: apply safe production source repairs"
            git push
          fi

      - name: TypeScript check
        run: npm run lint

      - name: Static security/data gate
        run: node scripts/static_security_gate.cjs

      - name: Source-of-truth regression gate
        run: node scripts/source_of_truth_gate.cjs

      - name: Production build
        run: npm run build
