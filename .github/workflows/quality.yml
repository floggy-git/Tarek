name: Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Repair known server blockers
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('server.ts')
          text = p.read_text(encoding='utf-8')
          replacements = [
              ("if (!isValidAdminSecret && !isAdminRoleWithToken) {", "if (!isValidAdminSecret) {"),
              ("const SHEETS_WEBHOOK_SECRET = process.env.SHEETS_WEBHOOK_SECRET || 'andalos_sec_sheets_webhook_2026_x9k2m1q8';", "const SHEETS_WEBHOOK_SECRET = process.env.SHEETS_WEBHOOK_SECRET || '';"),
              ("const ADMIN_SECRET_KEY = process.env.ADMIN_SECRET_KEY || 'andalos_admin_sec_2026_root_auth';", "const ADMIN_SECRET_KEY = process.env.ADMIN_SECRET_KEY || '';"),
          ]
          changed = False
          for old, new in replacements:
              if old in text:
                  text = text.replace(old, new, 1)
                  changed = True
          if changed:
              p.write_text(text, encoding='utf-8')
          PY
          if ! git diff --quiet -- server.ts; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add server.ts
            git commit -m 'fix: harden server authentication defaults'
            git push
          fi

      - name: TypeScript check
        run: npm run lint

      - name: Production build
        run: npm run build
