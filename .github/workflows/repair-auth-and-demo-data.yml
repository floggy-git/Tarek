name: One-time auth repair
on:
  push:
    branches: [production-repair]
permissions:
  contents: write
jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair security and package rules
        run: |
          python3 <<'PY'
          from pathlib import Path
          p=Path('server.ts'); s=p.read_text()
          old="""      const isValidAdminSecret = token === ADMIN_SECRET_KEY;
      const isAdminRoleWithToken = (userRole === 'admin' || userRole === 'administrator' || userRole === 'superadmin') && token.length >= 10;
      
      if (!isValidAdminSecret && !isAdminRoleWithToken) {"""
          new="""      const isValidAdminSecret = Boolean(ADMIN_SECRET_KEY && token === ADMIN_SECRET_KEY);
      if (!isValidAdminSecret) {"""
          p.write_text(s.replace(old,new,1))

          p=Path('src/App.tsx'); s=p.read_text()
          s=s.replace('password: "student123",','password: "",')
          s=s.replace("password: s.password || 'student123'", "password: s.password || ''")
          s=s.replace("const storedPassword = matchedStudent.password || 'student123';", "const storedPassword = String(matchedStudent.password || '');")
          p.write_text(s)

          p=Path('src/data.ts'); p.write_text(p.read_text().replace('Express Course (15h)', 'Starter Core Pack'))

          p=Path('src/components/adminControlCenter/AdminPackagesView.tsx'); s=p.read_text()
          s=s.replace("import {\n  Package,\n  Search,\n  Plus,", "import {\n  Package,\n  Search,")
          start=s.find("  const handleOpenNew = () => {")
          end=s.find("\n  const handleSavePackage", start)
          if start >= 0 and end > start: s=s[:start]+s[end:]
          s=s.replace("          <button\n            onClick={handleOpenNew}\n            className=\"px-3 py-1.5 rounded-lg text-xs font-bold text-white bg-teal-600 hover:bg-teal-700 flex items-center gap-1.5 cursor-pointer\"\n          >\n            <Plus size={14} />\n            <span>{lang === 'ar' ? 'إضافة باقة جديدة' : 'Add Package'}</span>\n          </button>\n", "")
          s=s.replace("    if (isNewPkg) {\n      updatedPackages = [...packages, finalPkg].sort((a, b) => a.displayOrder - b.displayOrder);\n    } else {", "    if (isNewPkg) return;\n    {")
          s=s.replace("    await recordAdminAuditLog({\n      action: isNewPkg ? 'Package Created' : 'Package Updated',", "    await recordAdminAuditLog({\n      action: 'Package Updated',")
          s=s.replace("                  {isNewPkg ? (lang === 'ar' ? 'إضافة باقة جديدة' : 'Add New Package') : `Edit: ${selectedPkg.name}`} ", "                  {`Edit: ${selectedPkg.name}`}")
          p.write_text(s)
          PY
      - name: Verify
        run: |
          npm install --no-audit --no-fund
          npm run lint
          npm run build
      - name: Commit repairs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.ts src/App.tsx src/data.ts src/components/adminControlCenter/AdminPackagesView.tsx
          git diff --cached --quiet || git commit -m "fix: remove forgeable auth fallback and package creation"
          git push
      - name: Remove one-time workflow
        if: success()
        run: |
          git rm .github/workflows/repair-auth-and-demo-data.yml
          git commit -m "chore: remove one-time repair workflow"
          git push
