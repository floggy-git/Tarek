name: One-time student auth repair
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove legacy client password verification
        run: |
          python3 <<'PY'
          from pathlib import Path
          p=Path('src/App.tsx')
          s=p.read_text()
          s=s.replace("const storedPassword = matchedStudent.password || 'student123';", "const storedPassword = String(matchedStudent.password || '');")
          start=s.find("      try {\n        if (storedPassword.startsWith('$2a$') || storedPassword.startsWith('$2b$')) {")
          if start != -1:
              end=s.find("\n\n      if (!loginPassword || !isPasswordCorrect)", start)
              if end != -1:
                  s=s[:start]+"      try {\n        await signInWithEmailAndPassword(firebaseAuth, cleanEmail, loginPassword);\n        isPasswordCorrect = true;\n      } catch (err) {\n        isPasswordCorrect = false;\n      }"+s[end:]
          p.write_text(s)
          PY
      - name: Verify
        run: |
          npm install --no-audit --no-fund
          npm run lint
          npm run build
          if grep -n "student123" src/App.tsx; then exit 1; fi
          if grep -n "bcrypt\.compareSync" src/App.tsx; then exit 1; fi
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx
          git diff --cached --quiet || git commit -m "fix: remove legacy student password fallback"
          git push
      - name: Remove workflow
        if: success()
        run: |
          git rm .github/workflows/repair-student-auth.yml
          git commit -m "chore: remove one-time student auth workflow"
          git push
