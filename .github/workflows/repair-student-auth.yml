name: One-time student auth repair
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair student authentication
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          p=Path('src/App.tsx')
          s=p.read_text()
          s=s.replace("import bcrypt from 'bcryptjs';", "import { createUserWithEmailAndPassword, signInWithEmailAndPassword } from 'firebase/auth';\nimport { auth as firebaseAuth } from './services/googleAuthService';")
          s=s.replace("import bcrypt from 'bcryptjs';\n", "")
          s=s.replace("const handleManualLogin = (e: React.FormEvent) => {", "const handleManualLogin = async (e: React.FormEvent) => {")
          s=s.replace("const handleRegisterSubmit = (e: React.FormEvent) => {", "const handleRegisterSubmit = async (e: React.FormEvent) => {")
          # Replace the complete legacy student password verification region.
          marker="      // Enforce password verification for registered students"
          start=s.find(marker)
          if start != -1:
              end=s.find("\n\n      if (!loginPassword || !isPasswordCorrect)", start)
              if end == -1: raise SystemExit('student auth marker end not found')
              replacement="""      // Firebase Auth is the only password authority.
      let isPasswordCorrect = false;
      try {
        await signInWithEmailAndPassword(firebaseAuth, cleanEmail, loginPassword);
        isPasswordCorrect = true;
      } catch {
        isPasswordCorrect = false;
      }"""
              s=s[:start]+replacement+s[end:]
          else:
              raise SystemExit('student auth marker not found')
          # Registration: create the Firebase Auth account before writing the profile row.
          old="const studentId = `ST-${String(students.length + 1).padStart(6, '0')}`;\n    const hashedPassword = bcrypt.hashSync(regPassword.trim(), 10);"
          new="""try {
      await createUserWithEmailAndPassword(firebaseAuth, regEmail.trim().toLowerCase(), regPassword.trim());
    } catch (authError: any) {
      const code = String(authError?.code || '');
      const message = code === 'auth/email-already-in-use'
        ? (lang === 'ar' ? 'هذا البريد مستخدم مسبقاً.' : lang === 'nl' ? 'Dit e-mailadres is al in gebruik.' : 'This email is already in use.')
        : (lang === 'ar' ? 'تعذر إنشاء الحساب. حاول مرة أخرى.' : lang === 'nl' ? 'Account aanmaken mislukt. Probeer opnieuw.' : 'Could not create the account. Please try again.');
      alert(message);
      return;
    }

    const studentId = `ST-${String(students.length + 1).padStart(6, '0')}`;"""
          if old in s:
              s=s.replace(old,new,1)
          else:
              s=s.replace("const studentId = `ST-${String(students.length + 1).padStart(6, '0')}`;", new+"\n    const __legacyStudentIdRemoved = true;",1)
              s=s.replace("const __legacyStudentIdRemoved = true;\n    ","",1)
          s=s.replace("      password: hashedPassword,\n", "")
          s=s.replace("'student123'", "''").replace('"student123"', '""')
          s=re.sub(r"bcrypt\.[A-Za-z]+\([^\n]*\)", "''", s)
          p.write_text(s)
          PY
      - name: Verify source
        run: |
          ! grep -n "student123" src/App.tsx
          ! grep -n "bcrypt" src/App.tsx
          grep -n "signInWithEmailAndPassword" src/App.tsx
          grep -n "createUserWithEmailAndPassword" src/App.tsx
      - name: Verify build
        run: |
          npm install --no-audit --no-fund
          npm run lint
          npm run build
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx
          git diff --cached --quiet || git commit -m "fix: move student password authentication to Firebase"
          git push
      - name: Remove workflow
        if: success()
        run: |
          git rm .github/workflows/repair-student-auth.yml
          git commit -m "chore: remove one-time student auth workflow"
          git push
