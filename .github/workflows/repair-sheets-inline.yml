name: Repair Sheets Source Of Truth
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-sheets-inline.yml'
permissions:
  contents: write
jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch canonical Sheets functions
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path('src/utils/googleSheets.ts')
          s = p.read_text()
          def rep(pattern, replacement, label):
              global s
              ns, n = re.subn(pattern, replacement, s, count=1, flags=re.S)
              if n != 1:
                  raise SystemExit(f'missing target: {label}')
              s = ns

          rep(r"export function parseSheetRowsToLessons\(rows: any\[\]\[\]\): Lesson\[\] \{.*?\n\}\n\n/\*\*\n \* Converts Lesson array into sheet rows format", '''export function parseSheetRowsToLessons(rows: any[][]): Lesson[] {
            if (!rows || rows.length <= 1) return [];
            const headers = rows[0].map(h => String(h ?? '').trim().toLowerCase());
            const idx = (name: string) => headers.indexOf(name.toLowerCase());
            const required = ['lesson id','student id','student name','trainer name','date','time','duration (h)','price (€)','pickup location','status','calendar event id','instructor notes','rating'];
            const positions = required.map(idx);
            if (positions.some(i => i === -1)) throw new Error('Lessons sheet schema mismatch. Expected canonical 13-column schema.');
            const parsed: Lesson[] = [];
            for (let i = 1; i < rows.length; i++) {
              const row = rows[i] || [];
              const id = String(row[positions[0]] ?? '').trim();
              const studentId = String(row[positions[1]] ?? '').trim();
              const studentName = String(row[positions[2]] ?? '').trim();
              if (!id || !studentId || !studentName) continue;
              parsed.push({
                id, studentId, studentName,
                trainerName: String(row[positions[3]] ?? '').trim(),
                date: String(row[positions[4]] ?? '').trim(),
                time: String(row[positions[5]] ?? '').trim(),
                duration: Number(row[positions[6]] ?? 1) || 1,
                price: Number(row[positions[7]] ?? 0) || 0,
                pickupLocation: String(row[positions[8]] ?? '').trim(),
                status: (String(row[positions[9]] ?? '').trim().toLowerCase() || 'upcoming') as any,
                calendarEventId: String(row[positions[10]] ?? '').trim() || undefined,
                instructorNotes: String(row[positions[11]] ?? '').trim() || undefined,
                performanceRating: row[positions[12]] !== undefined && row[positions[12]] !== '' ? Number(row[positions[12]]) : undefined
              } as Lesson);
            }
            return parsed;
          }

          /**
           * Converts Lesson array into sheet rows format''', 'Lessons parser')

          rep(r"export function convertLessonsToSheetRows\(lessons: Lesson\[\]\): any\[\]\[\] \{.*?\n\}\n\n/\*\*\n \* Loads lesson records", '''export function convertLessonsToSheetRows(lessons: Lesson[]): any[][] {
            const headers = ['Lesson ID','Student ID','Student Name','Trainer Name','Date','Time','Duration (h)','Price (€)','Pickup Location','Status','Calendar Event ID','Instructor Notes','Rating'];
            const rows: any[][] = [headers];
            for (const l of lessons) {
              if (isDemoLesson(l)) continue;
              if (!/^ST-\\d{6}$/.test(String(l.studentId || ''))) continue;
              rows.push([
                sanitizeSpreadsheetCell(l.id), sanitizeSpreadsheetCell(l.studentId), sanitizeSpreadsheetCell(l.studentName || ''),
                sanitizeSpreadsheetCell(l.trainerName || ''), sanitizeSpreadsheetCell(l.date || ''), sanitizeSpreadsheetCell(l.time || ''),
                Number(l.duration || 1), Number(l.price || 0), sanitizeSpreadsheetCell(l.pickupLocation || ''),
                sanitizeSpreadsheetCell(l.status || 'upcoming'), sanitizeSpreadsheetCell((l as any).calendarEventId || ''),
                sanitizeSpreadsheetCell(l.instructorNotes || (l as any).trainerNotes || ''),
                l.performanceRating !== undefined && l.performanceRating !== null ? Number(l.performanceRating) : ''
              ]);
            }
            return rows;
          }

          /**
           * Loads lesson records''', 'Lessons writer')

          s = s.replace('Lessons!A1:Q500', 'Lessons!A1:M500')
          s = s.replace('Students!A${targetRowIndex}:Q${targetRowIndex}', 'Students!A${targetRowIndex}:L${targetRowIndex}')
          old = """if (changes.name !== undefined) currentRow[1] = changes.name;\n    if (changes.email !== undefined) currentRow[2] = changes.email;\n    if (changes.phone !== undefined) currentRow[3] = changes.phone;\n    if (changes.city !== undefined) currentRow[4] = changes.city;\n    if (changes.currentPackage !== undefined) currentRow[5] = changes.currentPackage;\n    if (changes.balance !== undefined) currentRow[6] = changes.balance;\n    if (changes.readiness !== undefined) currentRow[7] = changes.readiness;\n    if (changes.theoryExamStatus !== undefined) currentRow[8] = changes.theoryExamStatus;\n    if (changes.status !== undefined) currentRow[11] = changes.status;\n    if (changes.notificationsEnabled !== undefined) currentRow[13] = changes.notificationsEnabled ? 'TRUE' : 'FALSE';\n    if (changes.aiWarningCount !== undefined) currentRow[14] = changes.aiWarningCount;\n    if (changes.aiSuspendedUntil !== undefined) currentRow[15] = changes.aiSuspendedUntil || '';\n    if (changes.aiSuspensionTier !== undefined) currentRow[16] = changes.aiSuspensionTier || 0;"""
          new = """if (changes.name !== undefined) currentRow[1] = changes.name;\n    if (changes.email !== undefined) currentRow[2] = changes.email;\n    if (changes.phone !== undefined) currentRow[3] = changes.phone;\n    if (changes.dob !== undefined) currentRow[4] = changes.dob;\n    if (changes.city !== undefined) currentRow[5] = changes.city;\n    if (changes.currentPackage !== undefined) currentRow[6] = changes.currentPackage;\n    if (changes.balance !== undefined) currentRow[7] = changes.balance;\n    if (changes.readiness !== undefined) currentRow[8] = changes.readiness;\n    if (changes.status !== undefined) currentRow[9] = changes.status;\n    if (changes.theoryExamStatus !== undefined) currentRow[10] = changes.theoryExamStatus;\n    if (changes.driveFolderId !== undefined) currentRow[11] = changes.driveFolderId || '';"""
          if old not in s:
              raise SystemExit('missing Students patch mapping')
          s = s.replace(old, new, 1)
          p.write_text(s)
      - name: Validate
        run: |
          npm install --no-audit --no-fund
          npm run lint
      - name: Commit and clean temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git restore package-lock.json
          rm -f .github/workflows/repair-sheets-inline.yml
          git add src/utils/googleSheets.ts
          git add -u .github/workflows/repair-sheets-inline.yml
          git diff --cached --quiet && exit 0 || (git commit -m 'fix: enforce canonical Sheets lesson and student schemas' && git push)
