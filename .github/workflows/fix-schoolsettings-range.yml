name: Apply SchoolSettings Range Correction

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor == 'floggy-git'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Correct SchoolSettings range
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/utils/googleSheets.ts')
          text = path.read_text(encoding='utf-8')
          old = 'SchoolSettings!A1:AM2'
          new = 'SchoolSettings!A1:AR2'
          count = text.count(old)
          if count != 2:
              raise SystemExit(f'Expected exactly 2 SchoolSettings ranges, found {count}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY

      - name: Verify source change
        run: |
          test "$(grep -o 'SchoolSettings!A1:AR2' src/utils/googleSheets.ts | wc -l)" -eq 2
          test "$(grep -o 'SchoolSettings!A1:AM2' src/utils/googleSheets.ts | wc -l)" -eq 0

      - name: Commit source correction and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/utils/googleSheets.ts .github/workflows/fix-schoolsettings-range.yml
          git rm .github/workflows/fix-schoolsettings-range.yml
          git commit -m "fix: align SchoolSettings range with 44-column schema"
          git push

# One-time source correction; workflow removes itself after the verified commit.
