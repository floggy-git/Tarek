name: One-time Firebase Auth source repair v2
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch App authentication source
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          p = Path('src/App.tsx')
          s = p.read_text()
          s = s.replace("import bcrypt from 'bcryptjs';", "import { signInWithEmailAndPassword, createUserWithEmailAndPassword, updateProfile } from 'firebase/auth';\nimport { auth } from './services/googleAuthService';")
          s = re.sub(r"\n\s*const handleDemoLogin = \(pRole: 'student' \| 'trainer'\) => \{[\s\S]*?\n\s*\};\n\n\s*const handleManualLogin", "\n\n  const handleManualLogin", s, count=1)
          login = '''  const handleManualLogin = async (e: React.FormEvent) => {
    e.preventDefault();
    const cleanEmail = loginEmail.trim().toLowerCase();
    if (!cleanEmail || !loginPassword) return;
    try {
      const credential = await signInWithEmailAndPassword(auth, cleanEmail, loginPassword);
      const firebaseUser = credential.user;
      const matchedStudent = students.find(s => s.email?.toLowerCase() === cleanEmail);
      const user = loginRole === 'student'
        ? { id: matchedStudent?.studentId || matchedStudent?.id, studentId: matchedStudent?.studentId || matchedStudent?.id, name: matchedStudent?.name || firebaseUser.displayName || cleanEmail.split('@')[0], email: firebaseUser.email || cleanEmail, phone: matchedStudent?.phone || '', role: 'student' as const, lang, packageId: matchedStudent?.packageId, packageName: matchedStudent?.packageName || matchedStudent?.currentPackage || matchedStudent?.packageSelection || '', packageSelection: matchedStudent?.packageName || matchedStudent?.currentPackage || matchedStudent?.packageSelection || '', currentPackage: matchedStudent?.currentPackage || matchedStudent?.packageName || matchedStudent?.packageSelection || '', packageHours: matchedStudent?.packageHours ?? matchedStudent?.targetHours ?? 0, targetHours: matchedStudent?.targetHours ?? matchedStudent?.packageHours ?? 0, packagePrice: matchedStudent?.packagePrice ?? 0, dob: matchedStudent?.dob || '', city: matchedStudent?.city || '', transmissionType: matchedStudent?.transmissionType || 'manual', notificationsEnabled: matchedStudent?.notificationsEnabled !== false }
        : { name: firebaseUser.displayName || cleanEmail.split('@')[0], email: firebaseUser.email || cleanEmail, phone: '', role: 'trainer' as const, lang, notificationsEnabled: schoolSettings ? schoolSettings.notificationsEnabled !== false : true };
      setCurrentUser(user);
      setLoginEmail('');
      setLoginPassword('');
      setActiveTab('home');
    } catch (err: any) {
      console.error('Firebase sign-in failed:', err);
      alert(lang === 'ar' ? 'البريد الإلكتروني أو كلمة المرور غير صحيحة.' : lang === 'nl' ? 'Ongeldig e-mailadres of wachtwoord.' : 'Invalid email or password.');
    }
  };

  const handleRegisterSubmit'''
          s, n = re.subn(r"  const handleManualLogin = \(e: React\.FormEvent\) => \{[\s\S]*?\n  \};\n\n  const handleRegisterSubmit", login, s, count=1)
          if n != 1: raise SystemExit('manual login target not found')
          register = '''  const handleRegisterSubmit = async (e: React.FormEvent) => {
    e.preventDefault();
    if (!regName.trim() || !regEmail.trim() || !regPhone.trim()) return;
    if (!regPassword || regPassword.length < 8 || regPassword !== regConfirmPassword) return;
    try {
      const credential = await createUserWithEmailAndPassword(auth, regEmail.trim().toLowerCase(), regPassword.trim());
      const firebaseUser = credential.user;
      await updateProfile(firebaseUser, { displayName: regName.trim() });
      const studentId = `ST-${String(students.length + 1).padStart(6, '0')}`;
      const selectedPkgObj = packages.find(p => p.id === regPackageId || p.name === regPackage || p.title === regPackage);
      const matchHours = regPackage.match(/(\\d+)\\s*(?:hours|hour|h|ساعة|uur)/i);
      const parsedPkgHours = selectedPkgObj?.hours !== undefined ? Number(selectedPkgObj.hours) : (matchHours ? parseInt(matchHours[1], 10) : 0);
      const parsedPkgPrice = selectedPkgObj?.price !== undefined ? Number(selectedPkgObj.price) : 0;
      const resolvedPkgName = selectedPkgObj?.name || selectedPkgObj?.title || regPackage;
      const newStudent = { id: studentId, studentId, firebaseUid: firebaseUser.uid, packageId: selectedPkgObj?.id || regPackageId, name: regName.trim(), email: firebaseUser.email || regEmail.trim().toLowerCase(), phone: regPhone.trim(), role: 'student' as const, lang, packageName: resolvedPkgName, packageSelection: resolvedPkgName, currentPackage: resolvedPkgName, packageHours: parsedPkgHours, targetHours: parsedPkgHours, packagePrice: parsedPkgPrice, dob: regDob, city: regCity, priorExperience: regExperience, transmissionType: regTransmission, theoryExamStatus: regTheoryStatus, notificationsEnabled: true };
      const newRecord: StudentRecord = { id: studentId, studentId, name: regName.trim(), email: firebaseUser.email || regEmail.trim().toLowerCase(), phone: regPhone.trim(), dob: regDob, city: regCity, packageId: selectedPkgObj?.id || regPackageId, packageName: resolvedPkgName, currentPackage: resolvedPkgName, packageSelection: resolvedPkgName, packageHours: parsedPkgHours, targetHours: parsedPkgHours, packagePrice: parsedPkgPrice, balance: 0, readiness: 0, status: 'active', theoryExamStatus: regTheoryStatus, notificationsEnabled: true };
      setStudents(prev => [...prev, newRecord]);
      setRegPassword('');
      setRegConfirmPassword('');
      setRegSuccessMessage(lang === 'ar' ? `أهلاً بك ${regName}! تم إنشاء حسابك بنجاح.` : lang === 'nl' ? `Welkom ${regName}! Je account is succesvol aangemaakt.` : `Welcome ${regName}! Your account was created successfully.`);
      setTimeout(() => { setCurrentUser(newStudent); setRegSuccessMessage(''); setActiveTab('home'); }, 4500);
    } catch (err: any) {
      console.error('Firebase registration failed:', err);
      alert(lang === 'ar' ? 'تعذر إنشاء الحساب. يرجى المحاولة مرة أخرى.' : lang === 'nl' ? 'Account aanmaken mislukt. Probeer het opnieuw.' : 'Unable to create the account. Please try again.');
    }
  };

  const handleForgotPasswordSubmit'''
          s, n = re.subn(r"  const handleRegisterSubmit = \(e: React\.FormEvent\) => \{[\s\S]*?\n  \};\n\n  const handleForgotPasswordSubmit", register, s, count=1)
          if n != 1: raise SystemExit('registration target not found')
          s = s.replace('student123', '')
          if 'bcrypt.compareSync' in s or 'bcrypt.hashSync' in s or 'loginPassword === storedPassword' in s or "const handleManualLogin = (e: React.FormEvent)" in s:
              raise SystemExit('insecure authentication code remains')
          if 'signInWithEmailAndPassword' not in s or 'createUserWithEmailAndPassword' not in s:
              raise SystemExit('Firebase Auth code missing')
          p.write_text(s)
          PY
      - name: Validate
        run: |
          npm install --no-audit --no-fund
          npm run lint
      - name: Commit and remove repair workflows
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx
          git commit -m "fix: enforce Firebase Auth in student login source"
          git rm .github/workflows/repair-firebase-auth-now.yml .github/workflows/repair-firebase-auth-v2.yml
          git commit -m "chore: remove one-time Firebase Auth repair workflows"
          git push
