name: One-time Firebase Auth source repair
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply repair
        run: node scripts/repair-student-auth-now.cjs
      - name: Validate
        run: |
          npm install --no-audit --no-fund
          npm run lint
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx scripts/repair-student-auth-now.cjs .github/workflows/repair-firebase-auth-now.yml
          git commit -m "fix: enforce Firebase Auth in student login source"
          git rm .github/workflows/repair-firebase-auth-now.yml .github/workflows/repair-firebase-auth-v2.yml
          git commit -m "chore: remove one-time Firebase Auth repair workflows"
          git push
