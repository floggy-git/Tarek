name: Apply Lessons Sheets Sync

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor == 'floggy-git'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Wire Lessons to Google Sheets
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/App.tsx')
          text = path.read_text(encoding='utf-8')

          old_import = "loadMediaVideosFromGoogleSheet, writeMediaVideosToGoogleSheet, checkGoogleDriveFileExists, loadSchoolSettingsFromGoogleSheet"
          new_import = "loadMediaVideosFromGoogleSheet, writeMediaVideosToGoogleSheet, loadLessonsFromGoogleSheet, writeLessonsToGoogleSheet, checkGoogleDriveFileExists, loadSchoolSettingsFromGoogleSheet"
          if text.count(old_import) != 1:
              raise SystemExit(f'Expected one App.tsx import anchor, found {text.count(old_import)}')
          text = text.replace(old_import, new_import)

          old_ref = "  const lastSavedStudentsRef = useRef<StudentRecord[]>([]);\n  const lastSavedSchoolSettingsRef = useRef<any>(null);"
          new_ref = "  const lastSavedStudentsRef = useRef<StudentRecord[]>([]);\n  const lastSavedLessonsRef = useRef<Lesson[]>([]);\n  const lastSavedSchoolSettingsRef = useRef<any>(null);"
          if text.count(old_ref) != 1:
              raise SystemExit(f'Expected one saved-ref anchor, found {text.count(old_ref)}')
          text = text.replace(old_ref, new_ref)

          old_load = """      loadStudentsFromGoogleSheet(config)\n        .then(stList => {\n          if (stList && stList.length > 0) {\n            setStudents(stList);\n            lastSavedStudentsRef.current = stList;\n          } else {\n            lastSavedStudentsRef.current = students;\n          }\n          isStudentsLoadedFromSheets.current = true;\n        })\n        .catch(err => {\n          console.error(\"Failed to auto-load students from Google Sheets on startup:\", err);\n          lastSavedStudentsRef.current = students;\n          isStudentsLoadedFromSheets.current = true;\n        });\n\n"""
          new_load = old_load + """      loadLessonsFromGoogleSheet(config)\n        .then(lessonList => {\n          setLessons(lessonList || []);\n          lastSavedLessonsRef.current = lessonList || [];\n        })\n        .catch(err => {\n          console.error(\"Failed to auto-load lessons from Google Sheets on startup:\", err);\n          lastSavedLessonsRef.current = lessons;\n        });\n\n"""
          if text.count(old_load) != 1:
              raise SystemExit(f'Expected one students-load block, found {text.count(old_load)}')
          text = text.replace(old_load, new_load)

          old_else = """      lastSavedStudentsRef.current = students;\n      lastSavedSchoolSettingsRef.current = schoolSettings;"""
          new_else = """      lastSavedStudentsRef.current = students;\n      lastSavedLessonsRef.current = lessons;\n      lastSavedSchoolSettingsRef.current = schoolSettings;"""
          if text.count(old_else) != 1:
              raise SystemExit(f'Expected one sheets-disabled ref block, found {text.count(old_else)}')
          text = text.replace(old_else, new_else)

          old_students_effect = """  // Auto-write media videos to Google Sheets on modification (debounced)\n  useEffect(() => {\n"""
          new_students_effect = """  // Auto-write lessons to Google Sheets on modification (debounced)\n  useEffect(() => {\n    if (!isSchoolSettingsLoadedFromSheets.current && !isStudentsLoadedFromSheets.current && !isVideosLoadedFromSheets.current) return;\n    if (lastSavedLessonsRef.current === lessons) return;\n\n    const timer = setTimeout(() => {\n      if (lastSavedLessonsRef.current && JSON.stringify(lastSavedLessonsRef.current) === JSON.stringify(lessons)) {\n        lastSavedLessonsRef.current = lessons;\n        return;\n      }\n\n      const config = getSheetsConfig();\n      if (config.spreadsheetId && config.accessToken) {\n        writeLessonsToGoogleSheet(config, lessons)\n          .then(() => {\n            console.log(\"Successfully synchronized lessons to Google Sheets in background.\");\n            lastSavedLessonsRef.current = lessons;\n          })\n          .catch(err => {\n            console.error(\"Failed to write lessons to Google Sheets in background:\", err);\n          });\n      }\n    }, 1500);\n\n    return () => clearTimeout(timer);\n  }, [lessons]);\n\n  // Auto-write media videos to Google Sheets on modification (debounced)\n  useEffect(() => {\n"""
          if text.count(old_students_effect) != 1:
              raise SystemExit(f'Expected one media-write anchor, found {text.count(old_students_effect)}')
          text = text.replace(old_students_effect, new_students_effect)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Verify source wiring
        run: |
          grep -q 'loadLessonsFromGoogleSheet' src/App.tsx
          grep -q 'writeLessonsToGoogleSheet' src/App.tsx
          grep -q 'lastSavedLessonsRef' src/App.tsx

      - name: Commit source correction and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx .github/workflows/apply-lessons-sheets-sync.yml
          git rm .github/workflows/apply-lessons-sheets-sync.yml
          git commit -m "fix: sync lessons with Google Sheets master"
          git push
