name: Production Repair Patch

on:
  push:
    branches: [production-repair]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: production-repair
          fetch-depth: 0

      - name: Apply minimal production repairs
        run: |
          node <<'NODE'
          const fs = require('fs');

          function replaceOnce(file, pattern, replacement, label) {
            let text = fs.readFileSync(file, 'utf8');
            const next = text.replace(pattern, replacement);
            if (next === text) throw new Error(`Patch target not found: ${label}`);
            fs.writeFileSync(file, next);
            console.log(`patched ${file}: ${label}`);
          }

          const server = 'server.ts';
          replaceOnce(server,
            /import \{ generateDashboardRows, buildNativeGoogleSheetsDashboard \} from '\.\/src\/services\/googleSheetsService\.ts';\n/,
            "import { generateDashboardRows, buildNativeGoogleSheetsDashboard } from './src/services/googleSheetsService.ts';\nimport { authenticateSyncRequest, principalCanAccessStudent, principalCanMutateEntity } from './src/services/serverAuth.ts';\n",
            'server auth import');

          replaceOnce(server,
            /  \/\/ 1\. SSE Stream Endpoint\n  app\.get\('\/api\/sync\/stream',[\\s\\S]*?\n  \}\);\n\n  \/\/ 2\. Targeted Granular Patch Endpoint/,
            `  // 1. SSE Stream Endpoint\n  app.get('/api/sync/stream', async (req, res) => {\n    try {\n      const principal = await authenticateSyncRequest(req);\n      if (!principal) return res.status(401).json({ success: false, error: 'Unauthorized: valid Firebase authentication required' });\n\n      const clientId = String(req.query.clientId || 'client-' + Date.now()).slice(0, 128);\n      const connectionId = \u0060\u0060;\n      const role = principal.role;\n      const studentId = principal.role === 'student' ? principal.studentId : undefined;\n      if (principal.role === 'student' && !studentId) {\n        return res.status(403).json({ success: false, error: 'Forbidden: student scope is missing from authenticated account' });\n      }\n      const actualConnectionId = \u0060\u0060;\n      const id = clientId + '-' + Date.now() + '-' + Math.random().toString(36).substring(2, 7);\n\n      res.writeHead(200, {\n        'Content-Type': 'text/event-stream',\n        'Cache-Control': 'no-cache, no-transform',\n        'Connection': 'keep-alive',\n        'X-Accel-Buffering': 'no'\n      });\n      res.write(':connected\\n\\n');\n\n      const clientObj = { id, clientId, role, studentId, res, connectedAt: Date.now(), lastPing: Date.now() };\n      sseClients.set(id, clientObj);\n      console.log(\u0060[SyncServer] Authenticated client connected: \u0024{clientId} (\u0024{role}\u0024{studentId ? ' : ' + studentId : ''}). Active clients: \u0024{sseClients.size}\u0060);\n\n      req.on('close', () => {\n        sseClients.delete(id);\n        console.log(\u0060[SyncServer] Client disconnected: \u0024{clientId}. Remaining clients: \u0024{sseClients.size}\u0060);\n      });\n    } catch (err) {\n      console.error('[SyncServer] Stream authentication failed:', err?.message || err);\n      if (!res.headersSent) res.status(401).json({ success: false, error: 'Unauthorized' });\n    }\n  });\n\n  // 2. Targeted Granular Patch Endpoint`,
            'sse auth');

          replaceOnce(server,
            /  app\.post\('\/api\/sync\/patch', express\.json\(\{ limit: '256kb' \}\), \(req, res\) => \{\n    try \{/,
            `  app.post('/api/sync/patch', express.json({ limit: '256kb' }), async (req, res) => {\n    try {\n      const principal = await authenticateSyncRequest(req);\n      if (!principal) return res.status(401).json({ success: false, error: 'Unauthorized: valid Firebase authentication required' });`,
            'patch auth');

          replaceOnce(server,
            /      const delta: SyncDeltaPayload = req\.body;\n      if \(!delta \|\| !delta\.entityType \|\| !delta\.entityId\) \{/,
            `      const delta: SyncDeltaPayload = req.body;\n      if (!delta || !delta.entityType || !delta.entityId) {`,
            'patch payload anchor');

          replaceOnce(server,
            /      delta\.updatedAt = delta\.updatedAt \|\| Date\.now\(\);/,
            `      const requestedStudentId = typeof delta.studentId === 'string' ? delta.studentId : undefined;\n      if (principal.role === 'student') {\n        if (!principalCanMutateEntity(principal, delta.entityType, String(delta.entityId), requestedStudentId)) {\n          return res.status(403).json({ success: false, error: 'Forbidden: entity is outside the authenticated student scope' });\n        }\n      }\n      delta.updatedAt = delta.updatedAt || Date.now();\n      delta.originClientId = String(delta.originClientId || '');`,
            'patch authorization');

          replaceOnce(server,
            /  app\.get\('\/api\/sync\/deltas', \(req, res\) => \{\n    const since = Number\(req\.query\.since \|\| 0\);\n    const missed = recentSyncDeltas\.filter\(d => d\.updatedAt > since\);\n    res\.json\(\{\n      success: true,\n      since,\n      count: missed\.length,\n      deltas: missed\n    \}\);\n  \}\);/,
            `  app.get('/api/sync/deltas', async (req, res) => {\n    const principal = await authenticateSyncRequest(req);\n    if (!principal) return res.status(401).json({ success: false, error: 'Unauthorized: valid Firebase authentication required' });\n    const since = Number(req.query.since || 0);\n    const missed = recentSyncDeltas.filter(d => {\n      if (d.updatedAt <= since) return false;\n      if (principal.role !== 'student') return true;\n      return principalCanAccessStudent(principal, d.studentId || (d.entityType === 'STUDENT' ? d.entityId : ''));\n    });\n    res.json({ success: true, since, count: missed.length, deltas: missed });\n  });`,
            'delta auth and scope');

          replaceOnce(server,
            /  app\.get\('\/api\/sync\/status', \(req, res\) => \{\n    res\.json\(\{/,
            `  app.get('/api/sync/status', async (req, res) => {\n    const principal = await authenticateSyncRequest(req);\n    if (!principal) return res.status(401).json({ success: false, error: 'Unauthorized: valid Firebase authentication required' });\n    res.json({`,
            'status auth');

          const sheets = 'src/services/googleSheetsService.ts';
          replaceOnce(sheets,
            /      let id = idIdx !== -1 && row\[idIdx\] \? String\(row\[idIdx\]\)\.trim\(\) : '';\n      if \(!id \|\| id === 'pack-1'\) id = 'PKG-000001';\n      else if \(id === 'pack-2'\) id = 'PKG-000002';\n      else if \(id === 'pack-3'\) id = 'PKG-000003';\n      else if \(!id\.startsWith\('PKG-'\)\) id = \`PKG-\$\{String\(i\)\.padStart\(6, '0'\)\}\`;\n\n      const name = nameIdx !== -1 && row\[nameIdx\] \? String\(row\[nameIdx\]\)\.trim\(\) : \`Package \$\{i\}\`;\n      const description = descIdx !== -1 && row\[descIdx\] \? String\(row\[descIdx\]\)\.trim\(\) : '';\n      const hours = hoursIdx !== -1 && row\[hoursIdx\] && !isNaN\(parseFloat\(row\[hoursIdx\]\)\) \? parseFloat\(row\[hoursIdx\]\) : 10;\n      const price = priceIdx !== -1 && row\[priceIdx\] && !isNaN\(parseFloat\(row\[priceIdx\]\)\) \? parseFloat\(row\[priceIdx\]\) : 650;/,
            `      let id = idIdx !== -1 && row[idIdx] ? String(row[idIdx]).trim() : '';\n      if (id === 'pack-1') id = 'PKG-000001';\n      else if (id === 'pack-2') id = 'PKG-000002';\n      else if (id === 'pack-3') id = 'PKG-000003';\n      if (!['PKG-000001', 'PKG-000002', 'PKG-000003'].includes(id)) continue;\n      if (packages.some(p => p.id === id)) continue;\n\n      const name = nameIdx !== -1 && row[nameIdx] ? String(row[nameIdx]).trim() : '';\n      const description = descIdx !== -1 && row[descIdx] ? String(row[descIdx]).trim() : '';\n      const hours = hoursIdx !== -1 && row[hoursIdx] && !isNaN(parseFloat(row[hoursIdx])) ? parseFloat(row[hoursIdx]) : NaN;\n      const price = priceIdx !== -1 && row[priceIdx] && !isNaN(parseFloat(row[priceIdx])) ? parseFloat(row[priceIdx]) : NaN;\n      if (!name || !Number.isFinite(hours) || !Number.isFinite(price)) continue;`,
            'remove fake package fallbacks');

          replaceOnce(sheets,
            /    return \{\n      success: true,\n      data: packages\.sort\(\(a, b\) => a\.displayOrder - b\.displayOrder\),\n      timestamp: new Date\(\)\.toISOString\(\)\n    \};/,
            `    const ordered = packages.sort((a, b) => a.displayOrder - b.displayOrder);\n    if (ordered.length !== 3 || new Set(ordered.map(p => p.id)).size !== 3) {\n      return { success: false, error: 'Packages source must contain exactly the three canonical packages: PKG-000001, PKG-000002, PKG-000003.', timestamp: new Date().toISOString() };\n    }\n    return { success: true, data: ordered, timestamp: new Date().toISOString() };`,
            'exactly three canonical packages');

          replaceOnce(sheets,
            /    const sorted = \[\.\.\.packages\]\.sort\(\(a, b\) => a\.displayOrder - b\.displayOrder\);/,
            `    const canonicalIds = ['PKG-000001', 'PKG-000002', 'PKG-000003'];\n    const sorted = [...packages].sort((a, b) => a.displayOrder - b.displayOrder);\n    if (sorted.length !== 3 || new Set(sorted.map(pkg => pkg.id)).size !== 3 || !canonicalIds.every(id => sorted.some(pkg => pkg.id === id))) {\n      throw new Error('Exactly the three canonical packages must be written: PKG-000001, PKG-000002, PKG-000003.');\n    }`,
            'package write validation');

          const serverText = fs.readFileSync(server, 'utf8');
          const demoSheetId = '1nKF40i125QY7MQMghOoOnyqjpHLFWKM12ZYIIGxW9Ck';
          if (serverText.includes(demoSheetId)) {
            const next = serverText.replace(new RegExp(`spreadsheetId \\|\\| '${demoSheetId}'`), "spreadsheetId || process.env.GOOGLE_SHEETS_SPREADSHEET_ID || ''");
            if (next === serverText) throw new Error('Demo spreadsheet ID was found but could not be replaced.');
            fs.writeFileSync(server, next);
          }

          NODE

      - name: Commit repairs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.ts src/services/googleSheetsService.ts
          if git diff --cached --quiet; then
            echo "No changes required"
            exit 0
          fi
          git commit -m "Fix sync authorization and canonical package source"
          git push origin HEAD:production-repair

      - name: Remove patch workflow
        if: success()
        run: |
          rm -f .github/workflows/production-repair-patch.yml
          git add .github/workflows/production-repair-patch.yml
          git commit -m "Remove one-time production repair workflow"
          git push origin HEAD:production-repair
